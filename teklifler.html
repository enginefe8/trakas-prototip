<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teklif Yönetimi - Trakas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        .tab-icerik { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .offer-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .offer-card:hover { transform: scale(1.01); }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col text-gray-900">

    <nav class="bg-[#0f172a] px-6 py-4 flex justify-between items-center w-full shadow-md z-50 relative">
        <a href="index.html" class="text-3xl font-black text-white italic tracking-tighter uppercase">TRAKAS</a>
        <div id="auth-menu" class="hidden lg:flex items-center gap-6"></div>
        <div id="auth-menu-mobil" class="lg:hidden flex items-center gap-3"></div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-[#0f172a] border-t border-gray-800 shadow-2xl flex-col z-50"></div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow">
        
        <div class="mb-10 border-b border-gray-200 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-[#0f172a] tracking-tight uppercase mb-2 flex items-center gap-3">
                    <svg class="w-8 h-8 text-[#facc15]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    TAKAS PANELİ
                </h1>
                <p class="text-gray-500 font-medium text-sm">Ticari tekliflerini ve takas süreçlerini buradan anlık yönetebilirsin.</p>
            </div>
            <div id="canli-durum" class="flex items-center gap-2 bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-full text-[10px] font-black tracking-widest border border-emerald-100">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span> CANLI TAKİP AKTİF
            </div>
        </div>

        <div id="yukleniyor" class="py-20 flex flex-col items-center justify-center w-full">
            <svg class="animate-spin h-10 w-10 text-[#0f172a] mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">VERİLER EŞİTLENİYOR...</span>
        </div>

        <div id="panel-alani" class="hidden">
            
            <div class="flex gap-2 p-1 bg-gray-200/50 rounded-2xl mb-8 w-full md:w-fit">
                <button onclick="sekmeDegistir('gelen')" id="tab-gelen" class="flex-1 md:px-8 py-3 text-[11px] font-black uppercase tracking-widest rounded-xl transition-all focus:outline-none bg-[#0f172a] text-[#facc15] shadow-lg">
                    GELEN <span id="gelen-sayac" class="ml-1 opacity-60">0</span>
                </button>
                <button onclick="sekmeDegistir('giden')" id="tab-giden" class="flex-1 md:px-8 py-3 text-[11px] font-black uppercase tracking-widest rounded-xl transition-all focus:outline-none text-gray-500 hover:bg-gray-200">
                    GİDEN <span id="giden-sayac" class="ml-1 opacity-60">0</span>
                </button>
            </div>

            <div id="icerik-gelen" class="tab-icerik flex flex-col gap-6"></div>
            <div id="icerik-giden" class="tab-icerik hidden flex flex-col gap-6"></div>

        </div>

    </main>

    <div id="ozel-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm transition-opacity" onclick="modalKapat()"></div>
        <div id="ozel-modal-kutu" class="relative bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-300">
            <div class="text-center">
                <div id="modal-ikon" class="mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6"></div>
                <h3 id="modal-baslik" class="text-xl font-black text-gray-900 mb-2 uppercase tracking-wide">Bilgi</h3>
                <p id="modal-mesaj" class="text-gray-600 font-medium text-sm mb-8 leading-relaxed"></p>
                <button id="modal-btn-ana" onclick="modalKapat()" class="w-full bg-[#0f172a] text-white font-black px-4 py-4 rounded-xl hover:bg-black transition-colors uppercase text-[10px] tracking-widest shadow-md">TAMAM</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let benimEmailim = "";
        let tumSistemIlanlari = [];
        let gecerliSekme = 'gelen';

        async function sitemiCalistir() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'giris.html'; return; }
            benimEmailim = session.user.email;
            
            menuOlusturGuncel(session);
            await verileriCekVeCiz();
            await bildirimleriKontrolEt();
            canliTakibiBaslat(); // YENİ: Realtime listener
        }

        function sekmeDegistir(sekme) {
            gecerliSekme = sekme;
            const bGelen = document.getElementById('tab-gelen');
            const bGiden = document.getElementById('tab-giden');
            const iGelen = document.getElementById('icerik-gelen');
            const iGiden = document.getElementById('icerik-giden');

            if(sekme === 'gelen') {
                bGelen.className = "flex-1 md:px-8 py-3 text-[11px] font-black uppercase tracking-widest rounded-xl transition-all focus:outline-none bg-[#0f172a] text-[#facc15] shadow-lg";
                bGiden.className = "flex-1 md:px-8 py-3 text-[11px] font-black uppercase tracking-widest rounded-xl transition-all focus:outline-none text-gray-500 hover:bg-gray-200";
                iGelen.classList.remove('hidden');
                iGiden.classList.add('hidden');
            } else {
                bGiden.className = "flex-1 md:px-8 py-3 text-[11px] font-black uppercase tracking-widest rounded-xl transition-all focus:outline-none bg-[#0f172a] text-[#facc15] shadow-lg";
                bGelen.className = "flex-1 md:px-8 py-3 text-[11px] font-black uppercase tracking-widest rounded-xl transition-all focus:outline-none text-gray-500 hover:bg-gray-200";
                iGiden.classList.remove('hidden');
                iGelen.classList.add('hidden');
            }
        }

        async function verileriCekVeCiz() {
            try {
                const { data: gidenler } = await _supabase.from('teklifler').select('*').eq('teklif_veren_email', benimEmailim).order('created_at', { ascending: false });
                
                const { data: ilanlarim } = await _supabase.from('ilanlar').select('id').eq('sahip_email', benimEmailim);
                const benimIlanIdleri = ilanlarim ? ilanlarim.map(i => i.id) : [];

                let gelenler = [];
                if(benimIlanIdleri.length > 0) {
                    const { data } = await _supabase.from('teklifler').select('*').in('ilan_id', benimIlanIdleri).neq('teklif_veren_email', benimEmailim).order('created_at', { ascending: false });
                    gelenler = data || [];
                }

                const tumIlgiliIlanIdleri = [...new Set([
                    ...gelenler.map(t => t.ilan_id), ...gelenler.map(t => t.teklif_edilen_ilan_id),
                    ...gidenler.map(t => t.ilan_id), ...gidenler.map(t => t.teklif_edilen_ilan_id)
                ])].filter(id => id != null);

                if (tumIlgiliIlanIdleri.length > 0) {
                    const { data } = await _supabase.from('ilanlar').select('id, baslik, resim_url, sahip_email').in('id', tumIlgiliIlanIdleri);
                    tumSistemIlanlari = data || [];
                }

                document.getElementById('yukleniyor').classList.add('hidden');
                document.getElementById('panel-alani').classList.remove('hidden');

                document.getElementById('gelen-sayac').innerText = gelenler.length;
                document.getElementById('giden-sayac').innerText = gidenler.length;

                cizGelenler(gelenler);
                cizGidenler(gidenler);

            } catch (err) { console.error(err); }
        }

        function cizGelenler(teklifler) {
            const alan = document.getElementById('icerik-gelen');
            if(teklifler.length === 0) { alan.innerHTML = `<div class="py-16 text-center text-gray-400 font-bold text-xs uppercase tracking-widest border-2 border-dashed border-gray-200 rounded-3xl bg-white">Henüz gelen bir teklif yok.</div>`; return; }

            let html = "";
            teklifler.forEach(t => {
                const benimIlan = tumSistemIlanlari.find(i => i.id === t.ilan_id);
                const sunulanIlan = tumSistemIlanlari.find(i => i.id === t.teklif_edilen_ilan_id);
                if(!benimIlan) return;

                const isim = t.teklif_veren_email.split('@')[0].toUpperCase();
                const durum = t.durum;
                const nakit = t.teklif_nakit || 0;

                html += `
                <div class="offer-card bg-white border border-gray-200 rounded-3xl overflow-hidden shadow-sm flex flex-col">
                    <div class="px-6 py-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
                        <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest"><span class="text-[#0f172a]">${isim}</span> SANA TEKLİF ATTI</div>
                        <span class="text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-widest ${durum==='Bekliyor' ? 'bg-yellow-100 text-yellow-700':'bg-green-100 text-green-700'}">${durum.toUpperCase()}</span>
                    </div>
                    <div class="p-6 flex flex-col md:flex-row items-center gap-6">
                        <div class="flex-1 w-full bg-[#0f172a] p-4 rounded-2xl border border-gray-800 relative overflow-hidden">
                             <div class="absolute -right-2 -top-2 opacity-10 text-white"><svg class="w-16 h-16" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></div>
                             <span class="text-[9px] font-black text-[#facc15] uppercase tracking-widest mb-2 block">SANA SUNULAN</span>
                             <div class="flex items-center gap-3">
                                <img src="${sunulanIlan?.resim_url?.split(',')[0] || ''}" class="w-12 h-12 rounded-lg object-cover bg-white/10">
                                <div class="min-w-0"><h4 class="text-white font-black text-sm uppercase truncate">${sunulanIlan?.baslik || 'Eşya Belirtilmemiş'}</h4></div>
                             </div>
                             ${nakit > 0 ? `<div class="mt-3 py-1.5 px-3 bg-emerald-500/20 rounded-lg text-emerald-400 font-black text-[10px] tracking-widest border border-emerald-500/30 flex items-center gap-2"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>+ ${nakit} TL NAKİT</div>`:''}
                        </div>
                        <div class="text-gray-300"><svg class="w-8 h-8 rotate-180 md:rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></div>
                        <div class="flex-1 w-full bg-gray-50 p-4 rounded-2xl border border-gray-100">
                             <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-2 block text-right">İSTEDİĞİ İLANIN</span>
                             <div class="flex items-center justify-end gap-3">
                                <div class="min-w-0 text-right"><h4 class="text-[#0f172a] font-black text-sm uppercase truncate">${benimIlan.baslik}</h4></div>
                                <img src="${benimIlan.resim_url?.split(',')[0] || ''}" class="w-12 h-12 rounded-lg object-cover border border-gray-200">
                             </div>
                        </div>
                    </div>
                    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex gap-3">
                        ${durum==='Bekliyor' ? `
                            <button onclick="teklifCevapla('${t.id}', 'Kabul Edildi')" class="flex-1 bg-[#0f172a] text-[#facc15] py-3 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-black shadow-md">KABUL ET</button>
                            <button onclick="teklifCevapla('${t.id}', 'Reddedildi')" class="flex-1 bg-white text-red-500 border border-red-100 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-red-50">REDDET</button>
                        ` : `<button onclick="window.location.href='sohbetler.html'" class="w-full bg-green-500 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md">MESAJLARA GİT</button>`}
                    </div>
                </div>`;
            });
            alan.innerHTML = html;
        }

        function cizGidenler(teklifler) {
            const alan = document.getElementById('icerik-giden');
            if(teklifler.length === 0) { alan.innerHTML = `<div class="py-16 text-center text-gray-400 font-bold text-xs uppercase tracking-widest border-2 border-dashed border-gray-200 rounded-3xl bg-white">Henüz bir teklif göndermemişsin.</div>`; return; }

            let html = "";
            teklifler.forEach(t => {
                const karsiIlan = tumSistemIlanlari.find(i => i.id === t.ilan_id);
                const benimSunulanIlan = tumSistemIlanlari.find(i => i.id === t.teklif_edilen_ilan_id);
                if(!karsiIlan) return;

                const isim = karsiIlan.sahip_email.split('@')[0].toUpperCase();
                const nakit = t.teklif_nakit || 0;

                html += `
                <div class="offer-card bg-white border border-gray-200 rounded-3xl overflow-hidden shadow-sm flex flex-col opacity-90 hover:opacity-100">
                    <div class="px-6 py-4 bg-gray-50/50 border-b border-gray-100 flex justify-between items-center">
                        <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest"><span class="text-[#0f172a]">${isim}</span> ADLI KULLANICIYA İLETTİN</div>
                        <span class="text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-widest ${t.durum==='Bekliyor' ? 'bg-blue-50 text-blue-600':'bg-green-50 text-green-600'}">${t.durum.toUpperCase()}</span>
                    </div>
                    <div class="p-6 flex flex-col md:flex-row items-center gap-6">
                        <div class="flex-1 w-full bg-gray-50 p-4 rounded-2xl border border-gray-100">
                             <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-2 block">SENİN SUNDUĞUN</span>
                             <div class="flex items-center gap-3">
                                <img src="${benimSunulanIlan?.resim_url?.split(',')[0] || ''}" class="w-12 h-12 rounded-lg object-cover grayscale opacity-60">
                                <div class="min-w-0"><h4 class="text-gray-600 font-black text-sm uppercase truncate">${benimSunulanIlan?.baslik || 'Eski Teklif'}</h4></div>
                             </div>
                             ${nakit > 0 ? `<div class="mt-3 text-[10px] font-black text-gray-500 uppercase tracking-widest">+ ${nakit} TL NAKİT</div>`:''}
                        </div>
                        <div class="text-gray-200"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7"></path></svg></div>
                        <div class="flex-1 w-full bg-[#0f172a] p-4 rounded-2xl border border-gray-800">
                             <span class="text-[9px] font-black text-blue-400 uppercase tracking-widest mb-2 block text-right">TALİP OLDUĞUN İLAN</span>
                             <div class="flex items-center justify-end gap-3">
                                <div class="min-w-0 text-right"><h4 class="text-white font-black text-sm uppercase truncate">${karsiIlan.baslik}</h4></div>
                                <img src="${karsiIlan.resim_url?.split(',')[0] || ''}" class="w-12 h-12 rounded-lg object-cover bg-white/10">
                             </div>
                        </div>
                    </div>
                    ${t.durum !== 'Bekliyor' ? `
                    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100">
                        <button onclick="window.location.href='sohbetler.html'" class="w-full bg-[#0f172a] text-[#facc15] py-3 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-black">SOHBETE GİT</button>
                    </div>` : ''}
                </div>`;
            });
            alan.innerHTML = html;
        }

        async function teklifCevapla(id, durum) {
            document.getElementById('yukleniyor').classList.remove('hidden');
            document.getElementById('panel-alani').classList.add('hidden');
            try {
                await _supabase.from('teklifler').update({ durum: durum }).eq('id', id);
                if(durum === 'Kabul Edildi') modalAc("HARİKA!", "Teklifi kabul ettin. Şimdi sohbet zamanı!", "basarili");
                await verileriCekVeCiz();
            } catch (e) { console.error(e); }
        }

        function canliTakibiBaslat() {
            _supabase.channel('public:teklifler')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'teklifler' }, () => {
                    verileriCekVeCiz(); // Herhangi bir degisiklikte listeyi yenile
                }).subscribe();
        }

        async function bildirimleriKontrolEt() {
            if (!benimEmailim) return;
            try {
                const { data: myIlans } = await _supabase.from('ilanlar').select('id').eq('sahip_email', benimEmailim);
                let bekleyenTeklif = 0;
                if (myIlans && myIlans.length > 0) {
                    const myIlanIds = myIlans.map(i => i.id);
                    const { count } = await _supabase.from('teklifler').select('*', { count: 'exact', head: true }).in('ilan_id', myIlanIds).eq('durum', 'Bekliyor').neq('teklif_veren_email', benimEmailim);
                    bekleyenTeklif = count || 0;
                }
                const { count: mesajCount } = await _supabase.from('mesajlar').select('*', { count: 'exact', head: true }).eq('alici_email', benimEmailim).is('okundu', false);
                const okunmamisMesaj = mesajCount || 0;

                document.querySelectorAll('.nav-teklif-badge').forEach(el => { el.innerHTML = bekleyenTeklif > 0 ? `<span class="bg-red-500 text-white rounded-full px-1.5 py-0.5 text-[8px] ml-1.5 flex items-center justify-center animate-pulse shadow-sm font-bold">${bekleyenTeklif}</span>` : ''; });
                document.querySelectorAll('.nav-mesaj-badge').forEach(el => { el.innerHTML = okunmamisMesaj > 0 ? `<span class="bg-red-500 text-white rounded-full px-1.5 py-0.5 text-[8px] ml-1.5 flex items-center justify-center animate-pulse shadow-sm font-bold">${okunmamisMesaj}</span>` : ''; });
            } catch (err) { console.error(err); }
        }

        function menuOlusturGuncel(session) {
            const menuDiv = document.getElementById('auth-menu');
            const mobilTopDiv = document.getElementById('auth-menu-mobil');
            const mobileMenu = document.getElementById('mobile-menu');
            const user = session.user;
            const gorunenIsim = user.user_metadata.ad_soyad ? user.user_metadata.ad_soyad.toUpperCase() : user.email.split('@')[0].toUpperCase();
            
            const badgeHtml = `
                <a href="profil.html" class="text-[#facc15] font-black text-xs uppercase tracking-widest border-b-2 border-[#facc15] pb-0.5 flex items-center gap-1.5">${gorunenIsim}</a>
                <a href="favorilerim.html" class="text-gray-400 font-bold text-[11px] uppercase tracking-widest hover:text-white transition-colors">FAVORİLERİM</a>
                <a href="ilanlarim.html" class="text-gray-400 font-bold text-[11px] uppercase tracking-widest hover:text-white transition-colors">İLANLARIM</a>
                <a href="sohbetler.html" class="text-gray-400 font-bold text-[11px] uppercase tracking-widest hover:text-white transition-colors flex items-center">MESAJLARIM <span class="nav-mesaj-badge"></span></a>
                <a href="teklifler.html" class="text-white font-black text-[11px] uppercase tracking-widest transition-colors flex items-center">TEKLİFLERİM <span class="nav-teklif-badge"></span></a>
                <span class="text-gray-700">|</span>
                <button onclick="cikisYap()" class="text-red-500 font-bold text-[11px] uppercase tracking-widest">ÇIKIŞ</button>
                <a href="ilan-ver.html" class="ml-2 bg-[#facc15] text-[#0f172a] px-6 py-2.5 rounded-lg font-black text-[11px] uppercase tracking-widest shadow-sm">İLAN VER</a>
            `;
            menuDiv.innerHTML = badgeHtml;
            mobilTopDiv.innerHTML = `<a href="ilan-ver.html" class="bg-[#facc15] text-[#0f172a] px-3 py-1.5 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-sm">İLAN VER</a><button onclick="toggleMobileMenu()" class="text-white p-1 focus:outline-none"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>`;
