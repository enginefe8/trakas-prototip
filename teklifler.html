<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teklif Yönetimi - Trakas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col text-gray-900">

    <nav class="bg-[#0f172a] px-6 py-4 flex justify-between items-center w-full shadow-md z-50 relative">
        <a href="index.html" class="text-3xl font-black text-white italic tracking-tighter uppercase">TRAKAS</a>
        <div id="auth-menu" class="hidden lg:flex items-center gap-6"></div>
        <div id="auth-menu-mobil" class="lg:hidden flex items-center gap-3"></div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-[#0f172a] border-t border-gray-800 shadow-2xl flex-col z-50"></div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
        
        <div class="mb-10 border-b border-gray-200 pb-6">
            <h1 class="text-3xl md:text-4xl font-black text-[#0f172a] tracking-tight uppercase mb-2 flex items-center gap-3">
                <svg class="w-8 h-8 text-[#facc15]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                TEKLİF YÖNETİMİ
            </h1>
            <p class="text-gray-500 font-medium text-sm">Gelen ve giden takas tekliflerinizi buradan profesyonelce yönetin.</p>
        </div>

        <div id="yukleniyor" class="py-20 flex flex-col items-center justify-center w-full">
            <svg class="animate-spin h-10 w-10 text-[#0f172a] mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">VERİLER ÇEKİLİYOR...</span>
        </div>

        <div id="panel-alani" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            
            <div class="flex border-b border-gray-100 bg-gray-50/50">
                <button onclick="sekmeDegistir('gelen')" id="tab-gelen" class="flex-1 py-4 text-xs font-black uppercase tracking-widest text-[#0f172a] border-b-2 border-[#facc15] transition-colors focus:outline-none">
                    Gelen Teklifler <span id="gelen-sayac" class="ml-2 bg-[#0f172a] text-[#facc15] px-2 py-0.5 rounded-full text-[9px]">0</span>
                </button>
                <button onclick="sekmeDegistir('giden')" id="tab-giden" class="flex-1 py-4 text-xs font-black uppercase tracking-widest text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition-colors focus:outline-none">
                    Gönderdiğim Teklifler <span id="giden-sayac" class="ml-2 bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full text-[9px]">0</span>
                </button>
            </div>

            <div class="p-4 md:p-8 bg-gray-50/30">
                <div id="icerik-gelen" class="tab-content active flex flex-col gap-6"></div>
                <div id="icerik-giden" class="tab-content flex flex-col gap-6"></div>
            </div>

        </div>

    </main>

    <div id="ozel-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm transition-opacity" onclick="modalKapat()"></div>
        <div id="ozel-modal-kutu" class="relative bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-300">
            <div class="text-center">
                <div id="modal-ikon" class="mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6"></div>
                <h3 id="modal-baslik" class="text-xl font-black text-gray-900 mb-2 uppercase tracking-wide">Bilgi</h3>
                <p id="modal-mesaj" class="text-gray-600 font-medium text-sm mb-8 leading-relaxed"></p>
                <button id="modal-btn-ana" onclick="modalKapat()" class="w-full bg-[#0f172a] text-white font-black px-4 py-4 rounded-xl hover:bg-black transition-colors uppercase text-[10px] tracking-widest shadow-md">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let benimEmailim = "";
        let tumIlanlarim = [];
        let tumSistemIlanlari = []; 

        async function sitemiCalistir() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'giris.html'; return; }
            benimEmailim = session.user.email;
            
            await verileriCekVeCiz();
        }

        function sekmeDegistir(sekmeAdi) {
            const btnGelen = document.getElementById('tab-gelen');
            const btnGiden = document.getElementById('tab-giden');
            const icerikGelen = document.getElementById('icerik-gelen');
            const icerikGiden = document.getElementById('icerik-giden');

            if(sekmeAdi === 'gelen') {
                btnGelen.className = "flex-1 py-4 text-xs font-black uppercase tracking-widest text-[#0f172a] border-b-2 border-[#facc15] transition-colors focus:outline-none";
                btnGiden.className = "flex-1 py-4 text-xs font-black uppercase tracking-widest text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition-colors focus:outline-none";
                icerikGelen.classList.add('active');
                icerikGiden.classList.remove('active');
            } else {
                btnGiden.className = "flex-1 py-4 text-xs font-black uppercase tracking-widest text-[#0f172a] border-b-2 border-[#facc15] transition-colors focus:outline-none";
                btnGelen.className = "flex-1 py-4 text-xs font-black uppercase tracking-widest text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition-colors focus:outline-none";
                icerikGiden.classList.add('active');
                icerikGelen.classList.remove('active');
            }
        }

        async function verileriCekVeCiz() {
            try {
                // 1. BENİM İLANLARIM (Hangi ilanlarıma teklif gelmiş bulmak için)
                const { data: myIlans } = await _supabase.from('ilanlar').select('id, baslik, resim_url').eq('sahip_email', benimEmailim);
                tumIlanlarim = myIlans || [];
                const benimIlanIdleri = tumIlanlarim.map(i => i.id);

                // 2. GELEN TEKLİFLER (Bana atılanlar)
                let gelenTeklifler = [];
                if(benimIlanIdleri.length > 0) {
                    const { data } = await _supabase.from('teklifler').select('*').in('ilan_id', benimIlanIdleri).order('created_at', { ascending: false });
                    gelenTeklifler = data || [];
                }

                // 3. GİDEN TEKLİFLER (Benim attıklarım)
                const { data: gidenTekliflerData } = await _supabase.from('teklifler').select('*').eq('teklif_veren_email', benimEmailim).order('created_at', { ascending: false });
                let gidenTeklifler = gidenTekliflerData || [];

                // 4. İLGİLİ TÜM İLANLARI ÇEK (Asıl ilanlar ve teklif edilen ilanlar)
                const ilgiliTumIlanIdleri = [...new Set([
                    ...gelenTeklifler.map(t => t.ilan_id),
                    ...gelenTeklifler.map(t => t.teklif_edilen_ilan_id).filter(id => id != null),
                    ...gidenTeklifler.map(t => t.ilan_id),
                    ...gidenTeklifler.map(t => t.teklif_edilen_ilan_id).filter(id => id != null)
                ])];

                if (ilgiliTumIlanIdleri.length > 0) {
                    const { data: ilanlarData } = await _supabase.from('ilanlar').select('id, baslik, resim_url, sahip_email').in('id', ilgiliTumIlanIdleri);
                    tumSistemIlanlari = ilanlarData || [];
                }

                document.getElementById('yukleniyor').classList.add('hidden');
                document.getElementById('panel-alani').classList.remove('hidden');

                document.getElementById('gelen-sayac').innerText = gelenTeklifler.length;
                document.getElementById('giden-sayac').innerText = gidenTeklifler.length;

                cizGelenTeklifler(gelenTeklifler);
                cizGidenTeklifler(gidenTeklifler);

            } catch (err) {
                console.error("Hata:", err);
                document.getElementById('yukleniyor').innerHTML = `<span class="text-red-500 font-bold text-xs uppercase tracking-widest">VERİLER ÇEKİLEMEDİ!</span>`;
            }
        }

        // --- GELEN TEKLİFLERİ ÇİZ ---
        function cizGelenTeklifler(teklifler) {
            const alan = document.getElementById('icerik-gelen');
            if(teklifler.length === 0) {
                alan.innerHTML = `<div class="py-12 text-center text-gray-400 font-bold text-xs uppercase tracking-widest border-2 border-dashed border-gray-200 rounded-2xl bg-white">Henüz ilanlarınıza gelen bir teklif bulunmuyor.</div>`;
                return;
            }

            let html = "";
            teklifler.forEach(teklif => {
                const benimIlanim = tumIlanlarim.find(i => i.id === teklif.ilan_id);
                if(!benimIlanim) return;

                const teklifEdilenEsya = tumSistemIlanlari.find(i => i.id === teklif.teklif_edilen_ilan_id);
                const teklifNakit = teklif.teklif_nakit || 0;
                
                let benimIlkResim = benimIlanim.resim_url ? benimIlanim.resim_url.split(',')[0] : "";
                let karsiIlkResim = (teklifEdilenEsya && teklifEdilenEsya.resim_url) ? teklifEdilenEsya.resim_url.split(',')[0] : "";
                
                const teklifEdenKisi = teklif.teklif_veren_email.split('@')[0].toUpperCase();

                let butonlarHTML = "";
                let durumEtiketi = "";
                let borderRenk = "border-gray-200";
                let bgRenk = "bg-white";

                if(teklif.durum === 'Bekliyor') {
                    durumEtiketi = `<span class="bg-yellow-100 text-yellow-700 text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-md shadow-sm">BEKLİYOR</span>`;
                    borderRenk = "border-yellow-200";
                    butonlarHTML = `
                        <button onclick="teklifCevapla('${teklif.id}', 'Kabul Edildi')" class="flex-1 bg-[#0f172a] text-[#facc15] px-4 py-3 md:py-2 rounded-xl md:rounded-lg font-black text-[10px] uppercase tracking-widest hover:bg-black transition-colors shadow-md">KABUL ET</button>
                        <button onclick="teklifCevapla('${teklif.id}', 'Reddedildi')" class="flex-1 bg-white text-red-500 border border-red-200 px-4 py-3 md:py-2 rounded-xl md:rounded-lg font-black text-[10px] uppercase tracking-widest hover:bg-red-50 transition-colors">REDDET</button>
                    `;
                } else if(teklif.durum === 'Kabul Edildi' || teklif.durum === 'Tamamlandı') {
                    durumEtiketi = `<span class="bg-green-100 text-green-700 text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-md shadow-sm">KABUL EDİLDİ</span>`;
                    borderRenk = "border-green-200";
                    bgRenk = "bg-green-50/30";
                    butonlarHTML = `<button onclick="window.location.href='sohbetler.html'" class="w-full bg-green-500 text-white px-6 py-3 md:py-2 rounded-xl md:rounded-lg font-black text-[10px] uppercase tracking-widest hover:bg-green-600 transition-colors shadow-md flex justify-center items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg> SOHBETE GİT</button>`;
                } else {
                    durumEtiketi = `<span class="bg-red-100 text-red-700 text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-md shadow-sm">REDDEDİLDİ</span>`;
                    borderRenk = "border-red-200";
                    bgRenk = "bg-red-50/30";
                }

                html += `
                <div class="flex flex-col border ${borderRenk} ${bgRenk} rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                    
                    <div class="flex items-center justify-between p-4 border-b border-gray-100 bg-gray-50/50">
                        <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">
                            <span class="text-[#0f172a] font-black">${teklifEdenKisi}</span> SİZE TEKLİF YAPTI
                        </div>
                        ${durumEtiketi}
                    </div>

                    <div class="flex flex-col md:flex-row p-4 md:p-6 gap-6 items-center relative">
                        
                        <a href="detay.html?id=${benimIlanim.id}" target="_blank" class="flex items-center gap-4 w-full md:w-5/12 group cursor-pointer bg-white p-3 rounded-xl border border-gray-100 hover:border-gray-300 transition-colors">
                            <div class="w-16 h-16 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 border border-gray-200">
                                ${benimIlkResim ? `<img src="${benimIlkResim}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[8px] font-bold text-gray-400">YOK</div>`}
                            </div>
                            <div class="min-w-0">
                                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-0.5 block group-hover:text-gray-500">İSTEDİĞİ İLANINIZ</span>
                                <h3 class="font-black text-sm text-[#0f172a] uppercase tracking-tight truncate group-hover:text-blue-600 transition-colors">${benimIlanim.baslik}</h3>
                            </div>
                        </a>

                        <div class="hidden md:flex flex-col items-center justify-center w-2/12 text-gray-300">
                            <svg class="w-8 h-8 rotate-180 md:rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </div>
                        
                        <div class="flex w-full md:hidden items-center justify-center text-gray-300 py-2">
                            <svg class="w-6 h-6 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </div>

                        <div class="flex flex-col w-full md:w-5/12 gap-2">
                            ${teklifEdilenEsya ? `
                                <a href="detay.html?id=${teklifEdilenEsya.id}" target="_blank" class="flex items-center gap-4 group cursor-pointer bg-[#0f172a] p-3 rounded-xl border border-gray-800 hover:bg-gray-900 transition-colors relative overflow-hidden">
                                    <div class="w-16 h-16 bg-white/10 rounded-lg overflow-hidden flex-shrink-0 border border-white/20">
                                        ${karsiIlkResim ? `<img src="${karsiIlkResim}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[8px] font-bold text-gray-400">YOK</div>`}
                                    </div>
                                    <div class="min-w-0 z-10">
                                        <span class="text-[9px] font-black text-[#facc15] uppercase tracking-widest mb-0.5 block">VERİLECEK EŞYA</span>
                                        <h3 class="font-black text-sm text-white uppercase tracking-tight truncate group-hover:text-blue-400 transition-colors">${teklifEdilenEsya.baslik}</h3>
                                    </div>
                                </a>
                            ` : `
                                <div class="flex items-center justify-center bg-gray-100 text-gray-400 text-[10px] font-bold uppercase tracking-widest p-4 rounded-xl border border-dashed border-gray-300 h-[90px]">Eşya Seçilmemiş (Eski)</div>
                            `}
                            
                            ${teklifNakit > 0 ? `
                                <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 shadow-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    + ${teklifNakit} TL NAKİT
                                </div>
                            ` : ''}
                        </div>

                    </div>
                    
                    ${teklif.durum === 'Bekliyor' ? `
                    <div class="p-4 bg-gray-50 border-t border-gray-100 flex gap-3">
                        ${butonlarHTML}
                    </div>
                    ` : `
                    <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-end">
                         <div class="w-full md:w-auto">${butonlarHTML}</div>
                    </div>
                    `}
                </div>`;
            });
            alan.innerHTML = html;
        }

        // --- GÖNDERİLEN TEKLİFLERİ ÇİZ ---
        function cizGidenTeklifler(teklifler) {
            const alan = document.getElementById('icerik-giden');
            if(teklifler.length === 0) {
                alan.innerHTML = `<div class="py-12 text-center text-gray-400 font-bold text-xs uppercase tracking-widest border-2 border-dashed border-gray-200 rounded-2xl bg-white">Henüz kimseye takas teklifi göndermediniz.</div>`;
                return;
            }

            let html = "";
            teklifler.forEach(teklif => {
                const karsiIlan = tumSistemIlanlari.find(i => i.id === teklif.ilan_id); // Talip olduğum ilan
                if(!karsiIlan) return;

                const teklifEttigimEsya = tumSistemIlanlari.find(i => i.id === teklif.teklif_edilen_ilan_id); // Benim sunduğum eşya
                const teklifNakit = teklif.teklif_nakit || 0;
                
                let karsiIlkResim = karsiIlan.resim_url ? karsiIlan.resim_url.split(',')[0] : "";
                let benimIlkResim = (teklifEttigimEsya && teklifEttigimEsya.resim_url) ? teklifEttigimEsya.resim_url.split(',')[0] : "";
                
                const ilanSahibi = karsiIlan.sahip_email.split('@')[0].toUpperCase();

                let durumEtiketi = "";
                let mesajButonu = "";
                let borderRenk = "border-gray-200";

                if(teklif.durum === 'Bekliyor') {
                    durumEtiketi = `<span class="bg-yellow-100 text-yellow-700 text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-md shadow-sm">CEVAP BEKLİYOR</span>`;
                } else if(teklif.durum === 'Kabul Edildi' || teklif.durum === 'Tamamlandı') {
                    durumEtiketi = `<span class="bg-green-100 text-green-700 text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-md shadow-sm">KABUL EDİLDİ</span>`;
                    borderRenk = "border-green-200";
                    mesajButonu = `<button onclick="window.location.href='sohbetler.html'" class="w-full md:w-auto bg-[#0f172a] text-[#facc15] px-6 py-3 md:py-2 rounded-xl md:rounded-lg font-black text-[10px] uppercase tracking-widest hover:bg-black transition-colors shadow-md flex justify-center items-center gap-2 mt-4 md:mt-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg> SOHBETE GİT</button>`;
                } else {
                    durumEtiketi = `<span class="bg-red-100 text-red-700 text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-md shadow-sm">REDDEDİLDİ</span>`;
                    borderRenk = "border-red-200";
                }

                html += `
                <div class="flex flex-col border ${borderRenk} bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow opacity-90 hover:opacity-100">
                    
                    <div class="flex items-center justify-between p-4 border-b border-gray-100 bg-gray-50/50">
                        <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">
                            <span class="text-[#0f172a] font-black">${ilanSahibi}</span> ADLI KULLANICIYA GÖNDERDİNİZ
                        </div>
                        ${durumEtiketi}
                    </div>

                    <div class="flex flex-col md:flex-row p-4 md:p-6 gap-6 items-center relative">
                        
                        <!-- BENİM SUNUDUĞUM -->
                        <div class="flex flex-col w-full md:w-5/12 gap-2">
                            ${teklifEttigimEsya ? `
                                <a href="detay.html?id=${teklifEttigimEsya.id}" target="_blank" class="flex items-center gap-4 group cursor-pointer bg-gray-50 p-3 rounded-xl border border-gray-200 hover:border-gray-300 transition-colors">
                                    <div class="w-16 h-16 bg-white rounded-lg overflow-hidden flex-shrink-0 border border-gray-200">
                                        ${benimIlkResim ? `<img src="${benimIlkResim}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all">` : `<div class="w-full h-full flex items-center justify-center text-[8px] font-bold text-gray-400">YOK</div>`}
                                    </div>
                                    <div class="min-w-0">
                                        <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-0.5 block">SİZİN SUNDUĞUNUZ</span>
                                        <h3 class="font-black text-sm text-gray-700 uppercase tracking-tight truncate">${teklifEttigimEsya.baslik}</h3>
                                    </div>
                                </a>
                            ` : `
                                <div class="flex items-center justify-center bg-gray-50 text-gray-400 text-[10px] font-bold uppercase tracking-widest p-4 rounded-xl border border-dashed border-gray-200 h-[90px]">Eşya Seçilmemiş (Eski)</div>
                            `}
                            
                            ${teklifNakit > 0 ? `
                                <div class="bg-gray-100 border border-gray-200 text-gray-600 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 shadow-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    + ${teklifNakit} TL NAKİT
                                </div>
                            ` : ''}
                        </div>

                        <!-- OK İŞARETİ -->
                        <div class="hidden md:flex flex-col items-center justify-center w-2/12 text-gray-300">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </div>
                        <div class="flex w-full md:hidden items-center justify-center text-gray-300 py-2">
                            <svg class="w-6 h-6 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </div>

                        <!-- İSTEDİĞİM İLAN -->
                        <a href="detay.html?id=${karsiIlan.id}" target="_blank" class="flex items-center gap-4 w-full md:w-5/12 group cursor-pointer bg-white p-3 rounded-xl border border-gray-200 shadow-sm hover:border-[#facc15] transition-colors">
                            <div class="w-16 h-16 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 border border-gray-200">
                                ${karsiIlkResim ? `<img src="${karsiIlkResim}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[8px] font-bold text-gray-400">YOK</div>`}
                            </div>
                            <div class="min-w-0">
                                <span class="text-[9px] font-black text-blue-500 uppercase tracking-widest mb-0.5 block">İSTEDİĞİNİZ İLAN</span>
                                <h3 class="font-black text-sm text-[#0f172a] uppercase tracking-tight truncate">${karsiIlan.baslik}</h3>
                            </div>
                        </a>

                    </div>

                    ${mesajButonu ? `
                    <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-end">
                        ${mesajButonu}
                    </div>
                    ` : ''}

                </div>`;
            });
            alan.innerHTML = html;
        }

        async function teklifCevapla(teklifId, yeniDurum) {
            document.getElementById('yukleniyor').classList.remove('hidden');
            document.getElementById('panel-alani').classList.add('hidden');

            try {
                const { error } = await _supabase.from('teklifler').update({ durum: yeniDurum }).eq('id', teklifId);
                if (error) throw error;
                
                await verileriCekVeCiz();

                if(yeniDurum === 'Kabul Edildi') {
                    modalAc("TEBRİKLER!", "Teklifi kabul ettiniz. Artık karşı tarafla sohbet edebilir ve takas detaylarını konuşabilirsiniz.", "basarili");
                }

            } catch(err) {
                modalAc("HATA", "İşlem sırasında bir hata oluştu.", "hata");
                await verileriCekVeCiz(); 
            }
        }

        function modalAc(baslik, mesaj, tip) {
            document.getElementById('modal-baslik').innerText = baslik; document.getElementById('modal-mesaj').innerText = mesaj;
            const ikon = document.getElementById('modal-ikon');
            if(tip === 'basarili') { ikon.className = "mx-auto h-16 w-16 rounded-full bg-green-50 flex items-center justify-center text-green-500 font-bold text-2xl border border-green-100"; ikon.innerHTML = "✓"; }
            else if(tip === 'hata') { ikon.className = "mx-auto h-16 w-16 rounded-full bg-red-50 flex items-center justify-center text-red-500 font-bold text-2xl border border-red-100"; ikon.innerHTML = "!"; }
            else { ikon.className = "mx-auto h-16 w-16 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-500 font-bold text-2xl border border-yellow-100"; ikon.innerHTML = "?"; }
            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        function modalKapat() { document.getElementById('ozel-modal-kutu').classList.add('scale-95', 'opacity-0'); setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 300); }
        async function cikisYap() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }

        async function initialize() {
            await sitemiCalistir();
            
            const menuDiv = document.getElementById('auth-menu');
            const mobilTopDiv = document.getElementById('auth-menu-mobil');
            const mobileMenu = document.getElementById('mobile-menu');
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                const gorunenIsim = session.user.user_metadata.ad_soyad ? session.user.user_metadata.ad_soyad.toUpperCase() : session.user.email.split('@')[0].toUpperCase();
                menuDiv.innerHTML = `<a href="profil.html" class="text-[#facc15] font-black text-xs uppercase tracking-widest border-b-2 border-[#facc15] pb-0.5">${gorunenIsim}</a> <a href="favorilerim.html" class="text-gray-400 font-bold text-[11px] uppercase tracking-widest hover:text-white transition-colors">FAVORİLERİM</a> <a href="ilanlarim.html" class="text-gray-400 font-bold text-[11px] uppercase tracking-widest hover:text-white transition-colors">İLANLARIM</a> <a href="sohbetler.html" class="text-gray-400 font-bold text-[11px] uppercase tracking-widest hover:text-white transition-colors">MESAJLARIM</a> <a href="teklifler.html" class="text-white font-black text-[11px] uppercase tracking-widest transition-colors">TEKLİFLERİM</a> <span class="text-gray-700">|</span> <button onclick="cikisYap()" class="text-red-500 font-bold text-[11px] uppercase tracking-widest hover:text-red-400">ÇIKIŞ</button> <a href="ilan-ver.html" class="ml-2 bg-[#facc15] text-[#0f172a] px-6 py-2.5 rounded-lg font-black text-[11px] uppercase tracking-widest shadow-sm">İLAN VER</a>`;
                mobilTopDiv.innerHTML = `<a href="ilan-ver.html" class="bg-[#facc15] text-[#0f172a] px-3 py-1.5 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-sm">İLAN VER</a> <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="text-white p-1 focus:outline-none"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>`;
                mobileMenu.innerHTML = `<a href="profil.html" class="block px-6 py-4 text-[#facc15] font-black text-[11px] uppercase tracking-widest border-b border-gray-800">${gorunenIsim}</a> <a href="favorilerim.html" class="block px-6 py-4 text-gray-300 font-bold text-[11px] uppercase tracking-widest border-b border-gray-800">FAVORİLERİM</a> <a href="teklifler.html" class="block px-6 py-4 text-[#facc15] font-black text-[11px] uppercase tracking-widest border-b border-gray-800">TEKLİFLERİM</a> <button onclick="cikisYap()" class="w-full text-left block px-6 py-4 text-red-500 font-bold text-[11px] uppercase tracking-widest border-b border-gray-800">ÇIKIŞ</button>`;
            }
        }

        initialize();
    </script>
</body>
</html>
