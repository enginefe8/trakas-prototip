<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Teklif Yönetimi — Trakas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .tab-icerik { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .offer-card { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    </style>
</head>
<body class="bg-[#f1f5f9] min-h-[100dvh] flex flex-col text-slate-900 antialiased overflow-x-hidden">

    <!-- ÜST MENÜ -->
    <nav class="bg-[#0b1120] border-b border-slate-800 sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-sm px-2 py-0.5 rounded-sm tracking-tighter">TR</span>
                <span class="text-2xl font-black text-white tracking-tight uppercase">TRAKAS</span>
            </a>
            <div id="auth-menu" class="hidden lg:flex items-center gap-6"></div>
            <div id="auth-menu-mobil" class="lg:hidden flex items-center gap-3"></div>
        </div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-[#0b1120] border-t border-slate-800 shadow-2xl flex-col z-50"></div>
    </nav>

    <!-- KOYU BAŞLIK BANDI -->
    <section class="bg-[#0f172a] border-b border-slate-800 w-full">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight flex items-center gap-2.5">
                    Takas Paneli <span class="text-[#facc15]">.</span>
                </h1>
                <p class="text-slate-400 font-medium text-xs sm:text-sm mt-1">
                    Gelen ve giden takas tekliflerini buradan anlık yönet.
                </p>
            </div>
            <div id="canli-durum" class="w-fit flex items-center gap-2 bg-emerald-950/70 text-emerald-400 px-3 py-1.5 rounded-sm text-[11px] font-bold tracking-wider uppercase border border-emerald-800/80">
                <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span> Canlı Takip Aktif
            </div>
        </div>
    </section>

    <!-- ANA İÇERİK -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">

        <div id="yukleniyor" class="py-20 flex flex-col items-center justify-center w-full">
            <svg class="animate-spin h-8 w-8 text-[#0f172a] mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Veriler eşitleniyor...</span>
        </div>

        <div id="panel-alani" class="hidden">

            <!-- SEKMELER -->
            <div class="grid grid-cols-2 sm:inline-flex gap-1 p-1 bg-white border border-slate-300 rounded-md mb-6 w-full sm:w-auto shadow-xs">
                <button onclick="sekmeDegistir('gelen')" id="tab-gelen" class="sm:px-7 py-2.5 min-h-[42px] text-xs font-extrabold uppercase tracking-wider rounded transition-colors focus:outline-none bg-[#0f172a] text-[#facc15] cursor-pointer">
                    Gelen <span id="gelen-sayac" class="ml-1.5 px-1.5 py-0.5 rounded-sm bg-white/15 text-[10px]">0</span>
                </button>
                <button onclick="sekmeDegistir('giden')" id="tab-giden" class="sm:px-7 py-2.5 min-h-[42px] text-xs font-extrabold uppercase tracking-wider rounded transition-colors focus:outline-none text-slate-600 hover:bg-slate-100 cursor-pointer">
                    Giden <span id="giden-sayac" class="ml-1.5 px-1.5 py-0.5 rounded-sm bg-slate-200 text-slate-700 text-[10px]">0</span>
                </button>
            </div>

            <div id="icerik-gelen" class="tab-icerik flex flex-col gap-4"></div>
            <div id="icerik-giden" class="tab-icerik hidden flex flex-col gap-4"></div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#0b1120] border-t-2 border-[#facc15] pt-7 pb-[max(1.75rem,env(safe-area-inset-bottom))] w-full mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-xs px-1.5 py-0.5 rounded-sm">TR</span>
                <span class="text-lg font-black text-white tracking-tight uppercase">TRAKAS</span>
                <span class="text-slate-500 text-xs font-medium ml-2">Takas Pazaryeri</span>
            </div>
            <p class="text-slate-500 text-xs font-medium">© 2026 TRAKAS. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- MODAL -->
    <div id="ozel-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-slate-950/75" onclick="modalKapat()"></div>
        <div id="ozel-modal-kutu" class="relative bg-white p-6 rounded-md border border-slate-300 shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-200">
            <div id="modal-ikon" class="hidden"></div>
            <h3 id="modal-baslik" class="text-base font-extrabold text-slate-900 mb-2 uppercase tracking-wide">Bilgi</h3>
            <p id="modal-mesaj" class="text-slate-600 font-medium text-sm mb-6 leading-relaxed"></p>
            <button id="modal-btn-ana" onclick="modalKapat()" class="w-full bg-[#0f172a] text-[#facc15] font-extrabold px-4 py-3 min-h-[44px] rounded hover:bg-black transition-colors uppercase text-xs tracking-wider cursor-pointer">Tamam</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let benimEmailim = "";
        let tumSistemIlanlari = [];
        let gecerliSekme = 'gelen';

        async function sitemiCalistir() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'giris.html'; return; }
            benimEmailim = session.user.email;

            menuOlusturGuncel(session);
            await verileriCekVeCiz();
            await bildirimleriKontrolEt();
            canliTakibiBaslat();
        }

        function sekmeDegistir(sekme) {
            gecerliSekme = sekme;
            const bGelen = document.getElementById('tab-gelen');
            const bGiden = document.getElementById('tab-giden');
            const iGelen = document.getElementById('icerik-gelen');
            const iGiden = document.getElementById('icerik-giden');
            const sGelen = document.getElementById('gelen-sayac');
            const sGiden = document.getElementById('giden-sayac');

            if (sekme === 'gelen') {
                bGelen.className = "sm:px-7 py-2.5 min-h-[42px] text-xs font-extrabold uppercase tracking-wider rounded transition-colors focus:outline-none bg-[#0f172a] text-[#facc15] cursor-pointer";
                bGiden.className = "sm:px-7 py-2.5 min-h-[42px] text-xs font-extrabold uppercase tracking-wider rounded transition-colors focus:outline-none text-slate-600 hover:bg-slate-100 cursor-pointer";
                sGelen.className = "ml-1.5 px-1.5 py-0.5 rounded-sm bg-white/15 text-[10px]";
                sGiden.className = "ml-1.5 px-1.5 py-0.5 rounded-sm bg-slate-200 text-slate-700 text-[10px]";
                iGelen.classList.remove('hidden');
                iGiden.classList.add('hidden');
            } else {
                bGiden.className = "sm:px-7 py-2.5 min-h-[42px] text-xs font-extrabold uppercase tracking-wider rounded transition-colors focus:outline-none bg-[#0f172a] text-[#facc15] cursor-pointer";
                bGelen.className = "sm:px-7 py-2.5 min-h-[42px] text-xs font-extrabold uppercase tracking-wider rounded transition-colors focus:outline-none text-slate-600 hover:bg-slate-100 cursor-pointer";
                sGiden.className = "ml-1.5 px-1.5 py-0.5 rounded-sm bg-white/15 text-[10px]";
                sGelen.className = "ml-1.5 px-1.5 py-0.5 rounded-sm bg-slate-200 text-slate-700 text-[10px]";
                iGiden.classList.remove('hidden');
                iGelen.classList.add('hidden');
            }
        }

        async function verileriCekVeCiz() {
            try {
                const { data: gidenler } = await _supabase.from('teklifler').select('*').eq('teklif_veren_email', benimEmailim).order('created_at', { ascending: false });

                const { data: ilanlarim } = await _supabase.from('ilanlar').select('id').eq('sahip_email', benimEmailim);
                const benimIlanIdleri = ilanlarim ? ilanlarim.map(i => i.id) : [];

                let gelenler = [];
                if (benimIlanIdleri.length > 0) {
                    const { data } = await _supabase.from('teklifler').select('*').in('ilan_id', benimIlanIdleri).neq('teklif_veren_email', benimEmailim).order('created_at', { ascending: false });
                    gelenler = data || [];
                }

                const tumIlgiliIlanIdleri = [...new Set([
                    ...gelenler.map(t => t.ilan_id), ...gelenler.map(t => t.teklif_edilen_ilan_id),
                    ...gidenler.map(t => t.ilan_id), ...gidenler.map(t => t.teklif_edilen_ilan_id)
                ])].filter(id => id != null);

                if (tumIlgiliIlanIdleri.length > 0) {
                    const { data } = await _supabase.from('ilanlar').select('id, baslik, resim_url, sahip_email').in('id', tumIlgiliIlanIdleri);
                    tumSistemIlanlari = data || [];
                }

                document.getElementById('yukleniyor').classList.add('hidden');
                document.getElementById('panel-alani').classList.remove('hidden');

                document.getElementById('gelen-sayac').innerText = gelenler.length;
                document.getElementById('giden-sayac').innerText = gidenler.length;

                cizGelenler(gelenler);
                cizGidenler(gidenler);

            } catch (err) { console.error(err); }
        }

        function cizGelenler(teklifler) {
            const alan = document.getElementById('icerik-gelen');
            if (teklifler.length === 0) {
                alan.innerHTML = `<div class="py-16 px-4 text-center text-slate-500 font-bold text-xs uppercase tracking-wider border border-slate-200 rounded-md bg-white">Henüz gelen bir teklif yok.</div>`;
                return;
            }

            let html = "";
            teklifler.forEach(t => {
                const benimIlan = tumSistemIlanlari.find(i => i.id === t.ilan_id);
                const sunulanIlan = tumSistemIlanlari.find(i => i.id === t.teklif_edilen_ilan_id);
                if (!benimIlan) return;

                const isim = t.teklif_veren_email.split('@')[0].toUpperCase();
                const durum = t.durum;
                const nakit = t.teklif_nakit || 0;
                const nakitStr = Number(nakit).toLocaleString('tr-TR');
                const durumSinif = durum === 'Bekliyor'
                    ? 'bg-amber-100 text-amber-800 border-amber-300'
                    : (durum === 'Reddedildi' ? 'bg-red-100 text-red-700 border-red-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300');

                html += `
                <div class="offer-card bg-white border border-slate-200 hover:border-slate-400 rounded-md overflow-hidden shadow-xs flex flex-col">
                    <div class="px-4 sm:px-5 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                        <div class="text-xs font-semibold text-slate-500">
                            <span class="font-extrabold text-slate-900">${isim}</span> sana teklif gönderdi
                        </div>
                        <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-sm border uppercase tracking-wider ${durumSinif}">${durum}</span>
                    </div>

                    <div class="p-4 sm:p-5 flex flex-col md:flex-row items-stretch md:items-center gap-3 sm:gap-4">
                        <div class="flex-1 min-w-0 bg-[#0f172a] p-4 rounded border border-slate-800">
                            <span class="text-[10px] font-extrabold text-[#facc15] uppercase tracking-wider mb-2.5 block">Sana Sunulan</span>
                            <div class="flex items-center gap-3">
                                <img src="${sunulanIlan?.resim_url?.split(',')[0] || ''}" onerror="this.style.display='none'" class="w-14 h-14 rounded-sm object-cover bg-slate-800 flex-shrink-0 border border-slate-700">
                                <div class="min-w-0 flex-1">
                                    <h4 class="text-white font-bold text-sm leading-snug truncate">${sunulanIlan?.baslik || 'Eşya Belirtilmemiş'}</h4>
                                </div>
                            </div>
                            ${nakit > 0 ? `<div class="mt-3 py-1.5 px-2.5 bg-emerald-500/15 rounded-sm text-emerald-400 font-extrabold text-xs tracking-wide border border-emerald-500/30 inline-flex items-center gap-1.5">+ ${nakitStr} ₺ Nakit Fark</div>` : ''}
                        </div>

                        <div class="flex justify-center items-center text-slate-400 flex-shrink-0 py-0.5 md:py-0">
                            <svg class="w-5 h-5 rotate-90 md:rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </div>

                        <div class="flex-1 min-w-0 bg-slate-50 p-4 rounded border border-slate-200">
                            <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-2.5 block md:text-right">İstediği İlanın</span>
                            <div class="flex items-center md:flex-row-reverse gap-3">
                                <img src="${benimIlan.resim_url?.split(',')[0] || ''}" onerror="this.style.display='none'" class="w-14 h-14 rounded-sm object-cover bg-slate-200 flex-shrink-0 border border-slate-300">
                                <div class="min-w-0 flex-1 md:text-right">
                                    <h4 class="text-slate-900 font-bold text-sm leading-snug truncate">${benimIlan.baslik}</h4>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="px-4 sm:px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex flex-col sm:flex-row gap-2.5">
                        ${durum === 'Bekliyor' ? `
                            <button onclick="teklifCevapla('${t.id}', 'Kabul Edildi')" class="flex-1 bg-[#0f172a] hover:bg-black text-[#facc15] py-3 min-h-[44px] rounded font-extrabold text-xs uppercase tracking-wider transition-colors cursor-pointer">Kabul Et</button>
                            <button onclick="teklifCevapla('${t.id}', 'Reddedildi')" class="flex-1 bg-white hover:bg-red-50 text-red-600 border border-red-300 py-3 min-h-[44px] rounded font-extrabold text-xs uppercase tracking-wider transition-colors cursor-pointer">Reddet</button>
                        ` : `
                            <button onclick="window.location.href='sohbetler.html'" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 min-h-[44px] rounded font-extrabold text-xs uppercase tracking-wider transition-colors cursor-pointer">Mesajlara Git →</button>
                        `}
                    </div>
                </div>`;
            });
            alan.innerHTML = html;
        }

        function cizGidenler(teklifler) {
            const alan = document.getElementById('icerik-giden');
            if (teklifler.length === 0) {
                alan.innerHTML = `<div class="py-16 px-4 text-center text-slate-500 font-bold text-xs uppercase tracking-wider border border-slate-200 rounded-md bg-white">Henüz bir teklif göndermemişsin.</div>`;
                return;
            }

            let html = "";
            teklifler.forEach(t => {
                const karsiIlan = tumSistemIlanlari.find(i => i.id === t.ilan_id);
                const benimSunulanIlan = tumSistemIlanlari.find(i => i.id === t.teklif_edilen_ilan_id);
                if (!karsiIlan) return;

                const isim = karsiIlan.sahip_email.split('@')[0].toUpperCase();
                const nakit = t.teklif_nakit || 0;
                const nakitStr = Number(nakit).toLocaleString('tr-TR');
                const durumSinif = t.durum === 'Bekliyor'
                    ? 'bg-sky-100 text-sky-800 border-sky-300'
                    : (t.durum === 'Reddedildi' ? 'bg-red-100 text-red-700 border-red-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300');

                html += `
                <div class="offer-card bg-white border border-slate-200 hover:border-slate-400 rounded-md overflow-hidden shadow-xs flex flex-col">
                    <div class="px-4 sm:px-5 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                        <div class="text-xs font-semibold text-slate-500">
                            <span class="font-extrabold text-slate-900">${isim}</span> kullanıcısına ilettin
                        </div>
                        <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-sm border uppercase tracking-wider ${durumSinif}">${t.durum}</span>
                    </div>

                    <div class="p-4 sm:p-5 flex flex-col md:flex-row items-stretch md:items-center gap-3 sm:gap-4">
                        <div class="flex-1 min-w-0 bg-slate-50 p-4 rounded border border-slate-200">
                            <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-2.5 block">Senin Sunduğun</span>
                            <div class="flex items-center gap-3">
                                <img src="${benimSunulanIlan?.resim_url?.split(',')[0] || ''}" onerror="this.style.display='none'" class="w-14 h-14 rounded-sm object-cover bg-slate-200 flex-shrink-0 border border-slate-300">
                                <div class="min-w-0 flex-1">
                                    <h4 class="text-slate-800 font-bold text-sm leading-snug truncate">${benimSunulanIlan?.baslik || 'Eski Teklif'}</h4>
                                </div>
                            </div>
                            ${nakit > 0 ? `<div class="mt-3 py-1 px-2.5 bg-slate-200/80 rounded-sm text-slate-700 font-bold text-xs inline-block">+ ${nakitStr} ₺ Nakit Fark</div>` : ''}
                        </div>

                        <div class="flex justify-center items-center text-slate-400 flex-shrink-0 py-0.5 md:py-0">
                            <svg class="w-5 h-5 rotate-90 md:rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7-7 7"></path></svg>
                        </div>

                        <div class="flex-1 min-w-0 bg-[#0f172a] p-4 rounded border border-slate-800">
                            <span class="text-[10px] font-extrabold text-[#facc15] uppercase tracking-wider mb-2.5 block md:text-right">Talip Olduğun İlan</span>
                            <div class="flex items-center md:flex-row-reverse gap-3">
                                <img src="${karsiIlan.resim_url?.split(',')[0] || ''}" onerror="this.style.display='none'" class="w-14 h-14 rounded-sm object-cover bg-slate-800 flex-shrink-0 border border-slate-700">
                                <div class="min-w-0 flex-1 md:text-right">
                                    <h4 class="text-white font-bold text-sm leading-snug truncate">${karsiIlan.baslik}</h4>
                                </div>
                            </div>
                        </div>
                    </div>

                    ${t.durum !== 'Bekliyor' ? `
                    <div class="px-4 sm:px-5 py-3.5 bg-slate-50 border-t border-slate-200">
                        <button onclick="window.location.href='sohbetler.html'" class="w-full bg-[#0f172a] hover:bg-black text-[#facc15] py-3 min-h-[44px] rounded font-extrabold text-xs uppercase tracking-wider transition-colors cursor-pointer">Sohbete Git →</button>
                    </div>` : ''}
                </div>`;
            });
            alan.innerHTML = html;
        }

        async function teklifCevapla(id, durum) {
            document.getElementById('yukleniyor').classList.remove('hidden');
            document.getElementById('panel-alani').classList.add('hidden');
            try {
                await _supabase.from('teklifler').update({ durum: durum }).eq('id', id);
                if (durum === 'Kabul Edildi') modalAc("Harika!", "Teklifi kabul ettin. Şimdi sohbet zamanı!", "basarili");
                await verileriCekVeCiz();
            } catch (e) { console.error(e); }
        }

        function canliTakibiBaslat() {
            _supabase.channel('public:teklifler')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'teklifler' }, () => {
                    verileriCekVeCiz();
                }).subscribe();
        }

        async function bildirimleriKontrolEt() {
            if (!benimEmailim) return;
            try {
                const { data: myIlans } = await _supabase.from('ilanlar').select('id').eq('sahip_email', benimEmailim);
                let bekleyenTeklif = 0;
                if (myIlans && myIlans.length > 0) {
                    const myIlanIds = myIlans.map(i => i.id);
                    const { count } = await _supabase.from('teklifler').select('*', { count: 'exact', head: true }).in('ilan_id', myIlanIds).eq('durum', 'Bekliyor').neq('teklif_veren_email', benimEmailim);
                    bekleyenTeklif = count || 0;
                }
                const { count: mesajCount } = await _supabase.from('mesajlar').select('*', { count: 'exact', head: true }).eq('alici_email', benimEmailim).is('okundu', false);
                const okunmamisMesaj = mesajCount || 0;

                document.querySelectorAll('.nav-teklif-badge').forEach(el => {
                    el.innerHTML = bekleyenTeklif > 0 ? `<span class="bg-red-600 text-white rounded px-1.5 py-0.5 text-[10px] ml-1.5 font-bold">${bekleyenTeklif}</span>` : '';
                });

                });
            } catch (err) { console.error(err); }
        }

            `;

            mobilTopDiv.innerHTML = `

        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }
        function modalAc(baslik, mesaj, tip) {
            document.getElementById('modal-baslik').innerText = baslik;
            document.getElementById('modal-mesaj').innerText = mesaj;
            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
        }
        function modalKapat() {
            document.getElementById('ozel-modal-kutu').classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 200);
        }
        async function cikisYap() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }

        sitemiCalistir();
