<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trakas — Takas Pazaryeri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .kalp-btn:active svg { transform: scale(1.25); transition: transform 0.1s; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

</head>
<body class="bg-[#f1f5f9] min-h-screen flex flex-col text-slate-900 antialiased">

    <!-- ÜST MENÜ -->
    <nav class="bg-[#0b1120] border-b border-slate-800 sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-sm px-2 py-0.5 rounded-sm tracking-tighter">TR</span>
                <span class="text-2xl font-black text-white tracking-tight uppercase">TRAKAS</span>
            </a>
            <div id="auth-menu" class="hidden lg:flex items-center gap-6"></div>
            <div id="auth-menu-mobil" class="lg:hidden flex items-center gap-3"></div>
        </div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-[#0b1120] border-t border-slate-800 shadow-2xl flex-col z-50"></div>
    </nav>

    <!-- KOYU ARAMA VE KOMUT BANDI -->
    <section class="bg-[#0f172a] border-b border-slate-800 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-7">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-5">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                        Takas Pazaryeri <span class="text-[#facc15]">.</span>
                    </h1>
                    <p class="text-slate-400 text-xs sm:text-sm font-medium mt-1">
                        Kullanmadığın ürünleri nakit ödemeden değerinde takasla.
                    </p>
                </div>
                <div id="ilan-sayaci" class="text-xs font-semibold text-slate-400 uppercase tracking-wider"></div>
            </div>

            <!-- KESKİN ARAMA KUTUSU -->
            <div class="relative z-40">
                <div class="flex flex-col sm:flex-row bg-white rounded-md overflow-visible border border-slate-700 shadow-lg">
                    <div class="flex-grow relative flex items-center px-4 py-3 sm:py-0">
                        <svg class="w-4 h-4 text-slate-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input
                            type="text"
                            id="arama-kutusu"
                            oninput="aramaOnerileriGoster(this.value)"
                            onkeydown="if(event.key==='Enter'){ document.getElementById('arama-onerileri').classList.add('hidden'); filtreleVeAra(); }"
                            autocomplete="off"
                            placeholder="Ürün, marka veya model ara... (Örn: iPad, PS5, Ekran Kartı)"
                            class="w-full bg-transparent outline-none text-sm font-semibold text-slate-900 placeholder-slate-400 py-1.5"
                        >
                        <div id="arama-onerileri" class="absolute w-full bg-white shadow-xl rounded-md mt-1 hidden max-h-60 overflow-y-auto border border-slate-300 top-full left-0 z-50"></div>
                    </div>

                    <div class="sm:border-l border-t sm:border-t-0 border-slate-200 flex items-center">
                        <select id="siralama-filtresi" onchange="filtreleVeAra()" class="w-full sm:w-44 bg-slate-50 px-3.5 py-3 text-xs font-bold text-slate-700 outline-none cursor-pointer">
                            <option value="varsayilan">Önce Vitrin & Yeni</option>
                            <option value="fiyat_artan">Değer: Düşükten Yükseğe</option>
                            <option value="fiyat_azalan">Değer: Yüksekten Düşüğe</option>
                        </select>
                    </div>

                    <button onclick="filtreleVeAra()" class="bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] px-7 py-3 font-extrabold text-xs uppercase tracking-wider transition-colors sm:rounded-r-md cursor-pointer">
                        ARA
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- TEK TIK KATEGORİ ŞERİDİ -->
    <div class="bg-white border-b border-slate-200 w-full sticky top-16 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <input type="hidden" id="kategori-filtresi" value="">
            <div id="kategori-seridi" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-2.5">
                <button data-kat="" onclick="kategoriSec('')" class="kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-[#0f172a] text-white">Tümü</button>
                <button data-kat="Elektronik" onclick="kategoriSec('Elektronik')" class="kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-slate-100 text-slate-700 hover:bg-slate-200">Elektronik</button>
                <button data-kat="Araç" onclick="kategoriSec('Araç')" class="kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-slate-100 text-slate-700 hover:bg-slate-200">Araç</button>
                <button data-kat="Eğlence & Hobi" onclick="kategoriSec('Eğlence & Hobi')" class="kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-slate-100 text-slate-700 hover:bg-slate-200">Eğlence & Hobi</button>
                <button data-kat="Giyim & Aksesuar" onclick="kategoriSec('Giyim & Aksesuar')" class="kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-slate-100 text-slate-700 hover:bg-slate-200">Giyim & Aksesuar</button>
                <button data-kat="Ev & Yaşam" onclick="kategoriSec('Ev & Yaşam')" class="kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-slate-100 text-slate-700 hover:bg-slate-200">Ev & Yaşam</button>
                <button data-kat="Diğer" onclick="kategoriSec('Diğer')" class="kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-slate-100 text-slate-700 hover:bg-slate-200">Diğer</button>
            </div>
        </div>
    </div>

    <!-- ANA İÇERİK -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">
        <div id="yukleniyor" class="py-20 flex flex-col items-center justify-center w-full">
            <svg class="animate-spin h-8 w-8 text-[#0f172a] mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">İlanlar yükleniyor...</span>
        </div>

        <div id="ilan-vitrini" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#0b1120] border-t-2 border-[#facc15] py-8 w-full mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-xs px-1.5 py-0.5 rounded-sm">TR</span>
                <span class="text-lg font-black text-white tracking-tight uppercase">TRAKAS</span>
                <span class="text-slate-500 text-xs font-medium ml-2">Takas Pazaryeri</span>
            </div>
            <p class="text-slate-500 text-xs font-medium">© 2026 TRAKAS. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- MODAL -->
    <div id="ozel-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-slate-950/75 backdrop-blur-xs" onclick="modalKapat()"></div>
        <div id="ozel-modal-kutu" class="relative bg-white p-6 rounded-lg border border-slate-300 shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-200">
            <h3 id="modal-baslik" class="text-base font-extrabold text-slate-900 mb-2 uppercase tracking-wide">Bilgi</h3>
            <p id="modal-mesaj" class="text-slate-600 font-medium text-sm mb-6 leading-relaxed"></p>
            <div class="flex justify-end gap-2">
                <button id="modal-btn-ikincil" onclick="modalKapat()" class="hidden bg-slate-100 text-slate-800 font-bold px-4 py-2.5 rounded text-xs uppercase tracking-wider hover:bg-slate-200 transition-colors">Kapat</button>
                <button id="modal-btn-ana" onclick="modalKapat()" class="bg-[#0f172a] text-white font-bold px-5 py-2.5 rounded text-xs uppercase tracking-wider hover:bg-black transition-colors">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let aktifSession = null;
        let tumIlanlarVeritabani = [];
        let benimFavorilerim = [];

        function guvenliMetin(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function fiyatFormatla(deger) {
            const sayi = Number(deger);
            if (isNaN(sayi)) return '0 ₺';
            return sayi.toLocaleString('tr-TR') + ' ₺';
        }

        function vitrinAktifMi(ilan) {
            if (!ilan || !ilan.vitrin_bitis) return false;
            return new Date(ilan.vitrin_bitis).getTime() > Date.now();
        }

        function tarihFormatla(tarihStr) {
            if (!tarihStr) return '';
            const d = new Date(tarihStr);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short' });
        }

        async function sitemiCalistir() {
            const { data: { session } } = await _supabase.auth.getSession();
            aktifSession = session;
            menuOlustur();
            if (aktifSession) {
                await favorileriHafizayaAl();
                await bildirimleriKontrolEt();
            }
            await tumIlanlariCek();
        }

        async function bildirimleriKontrolEt() {
            if (!aktifSession) return;
            const benimEmailim = aktifSession.user.email;

            try {
                const { data: myIlans } = await _supabase.from('ilanlar').select('id').eq('sahip_email', benimEmailim);
                let bekleyenTeklif = 0;
                if (myIlans && myIlans.length > 0) {
                    const myIlanIds = myIlans.map(i => i.id);
                    const { count } = await _supabase.from('teklifler')
                        .select('*', { count: 'exact', head: true })
                        .in('ilan_id', myIlanIds)
                        .in('durum', ['Bekliyor', 'bekliyor'])
                        .neq('teklif_veren_email', benimEmailim);
                    bekleyenTeklif = count || 0;
                }

                const { count: mesajCount } = await _supabase.from('mesajlar')
                    .select('*', { count: 'exact', head: true })
                    .eq('alici_email', benimEmailim)
                    .is('okundu', false);
                const okunmamisMesaj = mesajCount || 0;

                document.querySelectorAll('.nav-teklif-badge').forEach(el => {
                    el.innerHTML = bekleyenTeklif > 0
                        ? `<span class="bg-red-600 text-white rounded px-1.5 py-0.5 text-[10px] ml-1.5 font-bold">${bekleyenTeklif}</span>`
                        : '';
                });

                document.querySelectorAll('.nav-mesaj-badge').forEach(el => {
                    el.innerHTML = okunmamisMesaj > 0
                        ? `<span class="bg-red-600 text-white rounded px-1.5 py-0.5 text-[10px] ml-1.5 font-bold">${okunmamisMesaj}</span>`
                        : '';
                });
            } catch (err) {
                console.error("Radar hatası:", err);
            }
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function menuOlustur() {
            const menuDiv = document.getElementById('auth-menu');
            const mobilTopDiv = document.getElementById('auth-menu-mobil');
            const mobileMenu = document.getElementById('mobile-menu');

            if (aktifSession) {
                const user = aktifSession.user;
                const meta = user.user_metadata || {};
                const gorunenIsim = guvenliMetin(meta.ad_soyad ? meta.ad_soyad : user.email.split('@')[0]);

                menuDiv.innerHTML = `
                    <a href="profil.html" class="text-[#facc15] font-bold text-xs uppercase tracking-wider flex items-center gap-1.5 hover:text-yellow-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        ${gorunenIsim}
                    </a>
                    <a href="favorilerim.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">Favorilerim</a>
                    <a href="ilanlarim.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">İlanlarım</a>
                    <a href="sohbetler.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors flex items-center">Mesajlar <span class="nav-mesaj-badge"></span></a>
                    <a href="teklifler.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors flex items-center">Teklifler <span class="nav-teklif-badge"></span></a>
                    <span class="text-slate-700">|</span>
                    <button onclick="cikisYap()" class="text-slate-400 font-semibold text-xs hover:text-red-400 transition-colors cursor-pointer">Çıkış</button>
                    <a href="ilan-ver.html" class="bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] px-4 py-2 rounded font-extrabold text-xs uppercase tracking-wider transition-colors">+ İlan Ver</a>
                `;

                mobilTopDiv.innerHTML = `
                    <a href="ilan-ver.html" class="bg-[#facc15] text-[#0b1120] px-3 py-1.5 rounded font-extrabold text-[11px] uppercase">+ İlan Ver</a>
                    <button onclick="toggleMobileMenu()" class="text-white p-1 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                `;

                mobileMenu.innerHTML = `
                    <a href="profil.html" class="block px-5 py-3.5 text-[#facc15] font-bold text-xs uppercase border-b border-slate-800">${gorunenIsim}</a>
                    <a href="favorilerim.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">Favorilerim</a>
                    <a href="ilanlarim.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">İlanlarım</a>
                    <a href="sohbetler.html" class="px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800 flex items-center justify-between"><span>Mesajlar</span> <span class="nav-mesaj-badge"></span></a>
                    <a href="teklifler.html" class="px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800 flex items-center justify-between"><span>Teklifler</span> <span class="nav-teklif-badge"></span></a>
                    <button onclick="cikisYap()" class="w-full text-left block px-5 py-3.5 text-red-400 font-semibold text-xs">Çıkış Yap</button>
                `;
            } else {
                menuDiv.innerHTML = `<a href="giris.html" class="bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] px-5 py-2 rounded font-extrabold text-xs uppercase tracking-wider transition-colors">Giriş Yap / Kayıt Ol</a>`;
                mobilTopDiv.innerHTML = `
                    <a href="giris.html" class="text-[#facc15] font-bold text-xs mr-2">Giriş Yap</a>
                    <button onclick="toggleMobileMenu()" class="text-white p-1 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                `;
                mobileMenu.innerHTML = `<a href="giris.html" class="block px-5 py-4 text-[#facc15] font-bold text-xs uppercase text-center">Giriş Yap / Kayıt Ol</a>`;
            }
        }

        async function favorileriHafizayaAl() {
            const { data } = await _supabase.from('favoriler').select('ilan_id').eq('kullanici_email', aktifSession.user.email);
            if (data) { benimFavorilerim = data.map(f => Number(f.ilan_id)); }
        }

        async function favoriTetikle(event, ilanId) {
            event.preventDefault();
            event.stopPropagation();
            if (!aktifSession) {
                modalAc("Giriş Gerekli", "Favoriye eklemek için hesabınıza giriş yapmalısınız.", "uyari", true, () => window.location.href = 'giris.html');
                return;
            }

            const numId = Number(ilanId);
            const ikon = document.getElementById(`kalp-ikon-${numId}`);
            const isFavori = benimFavorilerim.includes(numId);

            if (isFavori) {
                benimFavorilerim = benimFavorilerim.filter(id => id !== numId);
                ikon.className = "w-4 h-4 text-slate-600 transition-colors";
                ikon.setAttribute('fill', 'none');
                _supabase.from('favoriler').delete().eq('ilan_id', numId).eq('kullanici_email', aktifSession.user.email).then();
            } else {
                benimFavorilerim.push(numId);
                ikon.className = "w-4 h-4 text-red-600 fill-current transition-colors";
                ikon.setAttribute('fill', 'currentColor');
                _supabase.from('favoriler').insert([{ ilan_id: numId, kullanici_email: aktifSession.user.email }]).then();
            }
        }

        function turkceTemizle(metin) {
            if (!metin) return "";
            return metin.toLowerCase()
                .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
                .replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c')
                .replace(/i̇/g, 'i');
        }

        async function tumIlanlariCek() {
            try {
                const { data: ilanlar, error } = await _supabase
                    .from('ilanlar')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) throw error;
                tumIlanlarVeritabani = (ilanlar || []).filter(i => i.durum !== 'Takaslandı');
                filtreleVeAra();
            } catch (err) {
                document.getElementById('yukleniyor').innerHTML = `<span class="text-red-600 font-bold text-xs uppercase tracking-wider">İlanlar yüklenemedi. Lütfen sayfayı yenileyin.</span>`;
            }
        }

        function aramaOnerileriGoster(kelime) {
            const oneriKutusu = document.getElementById('arama-onerileri');
            if (kelime.trim().length < 1) { oneriKutusu.classList.add('hidden'); return; }
            const temizAranan = turkceTemizle(kelime);
            const eslesenBasliklar = [...new Set(
                tumIlanlarVeritabani
                    .filter(ilan => turkceTemizle(ilan.baslik).includes(temizAranan))
                    .map(i => i.baslik)
            )].slice(0, 5);

            if (eslesenBasliklar.length > 0) {
                oneriKutusu.innerHTML = '<ul class="divide-y divide-slate-100">' + eslesenBasliklar.map((baslik, idx) => `
                    <li data-idx="${idx}" class="oneri-item px-4 py-2.5 hover:bg-slate-50 cursor-pointer text-sm font-semibold text-slate-800 flex items-center gap-2.5">
                        <svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <span>${guvenliMetin(baslik)}</span>
                    </li>
                `).join('') + '</ul>';

                oneriKutusu.querySelectorAll('.oneri-item').forEach((li, idx) => {
                    li.addEventListener('click', () => oneriSec(eslesenBasliklar[idx]));
                });
                oneriKutusu.classList.remove('hidden');
            } else {
                oneriKutusu.classList.add('hidden');
            }
        }

        function oneriSec(secilenBaslik) {
            document.getElementById('arama-kutusu').value = secilenBaslik;
            document.getElementById('arama-onerileri').classList.add('hidden');
            filtreleVeAra();
        }

        function kategoriSec(deger) {
            document.getElementById('kategori-filtresi').value = deger;
            document.querySelectorAll('.kat-btn').forEach(btn => {
                if (btn.dataset.kat === deger) {
                    btn.className = "kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-[#0f172a] text-white";
                } else {
                    btn.className = "kat-btn px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition-colors bg-slate-100 text-slate-700 hover:bg-slate-200";
                }
            });
            filtreleVeAra();
        }

        document.addEventListener('click', function (e) {
            if (!document.getElementById('arama-kutusu').contains(e.target) && !document.getElementById('arama-onerileri').contains(e.target)) {
                document.getElementById('arama-onerileri').classList.add('hidden');
            }
        });

        function filtreleVeAra() {
            const arama = turkceTemizle(document.getElementById('arama-kutusu').value.trim());
            const kategori = document.getElementById('kategori-filtresi').value;
            const siralama = document.getElementById('siralama-filtresi').value;

            let filtrelenmis = tumIlanlarVeritabani.filter(ilan => {
                const matchesKategori = !kategori || ilan.kategori === kategori;
                const matchesArama = !arama || turkceTemizle(ilan.baslik).includes(arama) || turkceTemizle(ilan.aciklama).includes(arama);
                return matchesKategori && matchesArama;
            });

            // Vitrin ilanları her zaman en üstte, ardından seçili sıralama
            filtrelenmis.sort((a, b) => {
                const aVitrin = vitrinAktifMi(a) ? 1 : 0;
                const bVitrin = vitrinAktifMi(b) ? 1 : 0;
                if (aVitrin !== bVitrin) return bVitrin - aVitrin;

                if (siralama === 'fiyat_artan') return (Number(a.deger) || 0) - (Number(b.deger) || 0);
                if (siralama === 'fiyat_azalan') return (Number(b.deger) || 0) - (Number(a.deger) || 0);
                return new Date(b.created_at) - new Date(a.created_at);
            });

            ekranaBas(filtrelenmis);
        }

        function ekranaBas(ilanlar) {
            const vitrin = document.getElementById('ilan-vitrini');
            const sayac = document.getElementById('ilan-sayaci');
            document.getElementById('yukleniyor').classList.add('hidden');

            sayac.textContent = `${ilanlar.length} AKTİF İLAN`;

            if (!ilanlar || ilanlar.length === 0) {
                vitrin.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 text-center bg-white rounded-md border border-slate-200">
                        <h3 class="font-extrabold text-slate-900 text-base uppercase tracking-wide mb-1">İlan Bulunamadı</h3>
                        <p class="text-slate-500 text-sm">Farklı bir arama terimi veya kategori deneyin.</p>
                    </div>`;
                return;
            }

            let html = "";
            ilanlar.forEach(ilan => {
                const ilkResim = ilan.resim_url ? ilan.resim_url.split(',')[0].trim() : "";
                const isFavori = benimFavorilerim.includes(Number(ilan.id));
                const isVitrin = vitrinAktifMi(ilan);
                const kartSinifi = isVitrin
                    ? "border-2 border-[#eab308] shadow-md hover:border-[#ca8a04]"
                    : "border border-slate-200 hover:border-slate-900";

                html += `
                <a href="detay.html?id=${ilan.id}" class="group bg-white rounded-md ${kartSinifi} overflow-hidden transition-all duration-150 flex flex-col relative">
                    <div class="w-full h-48 bg-slate-100 relative overflow-hidden flex items-center justify-center border-b border-slate-100">
                        ${isVitrin ? `
                            <span class="absolute top-2.5 left-2.5 z-20 bg-[#0b1120] text-[#facc15] border border-[#facc15] px-2 py-0.5 rounded-sm text-[10px] font-extrabold uppercase tracking-wider flex items-center gap-1 shadow">
                                ★ VİTRİN
                            </span>
                        ` : `
                            <span class="absolute top-2.5 left-2.5 z-20 bg-slate-900/80 text-white px-2 py-0.5 rounded-sm text-[10px] font-semibold uppercase tracking-wide">
                                ${guvenliMetin(ilan.kategori || 'Diğer')}
                            </span>
                        `}

                        <button onclick="favoriTetikle(event, '${ilan.id}')" class="kalp-btn absolute top-2.5 right-2.5 bg-white/95 hover:bg-white border border-slate-200 p-2 rounded z-20 focus:outline-none cursor-pointer">
                            <svg id="kalp-ikon-${ilan.id}" class="w-4 h-4 ${isFavori ? 'text-red-600 fill-current' : 'text-slate-600'} transition-colors" fill="${isFavori ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                            </svg>
                        </button>

                        ${ilkResim
                            ? `<img src="${guvenliMetin(ilkResim)}" onerror="this.style.display='none'" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">`
                            : `<span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Görsel Yok</span>`
                        }
                    </div>

                    <div class="p-4 flex flex-col flex-grow ${isVitrin ? 'bg-amber-50/30' : 'bg-white'}">
                        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1">
                            <span>${isVitrin ? guvenliMetin(ilan.kategori || 'Diğer') : ''}</span>
                            <span>${tarihFormatla(ilan.created_at)}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-sm leading-snug line-clamp-2 mb-2 group-hover:text-[#0f172a]">
                            ${guvenliMetin(ilan.baslik)}
                        </h3>
                        ${ilan.takas_tercihi ? `
                            <p class="text-[11px] text-slate-500 font-medium line-clamp-1 mb-3">
                                <span class="font-bold text-slate-700">Takas:</span> ${guvenliMetin(ilan.takas_tercihi)}
                            </p>
                        ` : '<div class="mb-3"></div>'}
                        <div class="mt-auto pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span class="font-extrabold text-slate-950 text-base tracking-tight">${fiyatFormatla(ilan.deger)}</span>
                            <span class="text-[11px] font-bold text-slate-500 group-hover:text-slate-900 transition-colors">İncele →</span>
                        </div>
                    </div>
                </a>`;
            });
            vitrin.innerHTML = html;
        }

        function modalAc(baslik, mesaj, tip, isIptal = false, onayFonk = null) {
            document.getElementById('modal-baslik').innerText = baslik;
            document.getElementById('modal-mesaj').innerText = mesaj;
            if (isIptal) {
                document.getElementById('modal-btn-ikincil').classList.remove('hidden');
                document.getElementById('modal-btn-ana').onclick = () => { modalKapat(); if (onayFonk) onayFonk(); };
            } else {
                document.getElementById('modal-btn-ikincil').classList.add('hidden');
                document.getElementById('modal-btn-ana').onclick = () => { modalKapat(); if (onayFonk) onayFonk(); };
            }
            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        function modalKapat() {
            document.getElementById('ozel-modal-kutu').classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 200);
        }

        async function cikisYap() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        sitemiCalistir();
    </script>
</body>
</html>
