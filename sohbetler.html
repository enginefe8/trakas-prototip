<!DOCTYPE html>
<html lang="tr">
<head>

    <!-- SOHBET ANA ALANI -->

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let benimEmailim = "";
        let tumSohbetler = [];
        let aktifTeklifId = null;
        let aktifKarsiEmail = "";
        let realtimeAbonelik = null;
        let secilenPuan = 0;

        async function sitemiCalistir() {
            try {
                const { data: { session }, error } = await _supabase.auth.getSession();
                if (error) throw error;
                if (!session) { window.location.href = 'giris.html'; return; }

                benimEmailim = session.user.email;
                menuOlusturGuncel(session);

                await sohbetListesiniCek();
                await bildirimleriKontrolEt();
            } catch (err) {
                console.error("Sistem Başlatma Hatası:", err);
                document.getElementById('sohbet-listesi').innerHTML = `
                    <div class="p-4 m-2 bg-red-50 border border-red-200 rounded text-center">
                        <div class="text-red-700 font-extrabold text-xs uppercase tracking-wider mb-1.5 border-b border-red-200 pb-1.5">Kritik Bir Hata Oluştu</div>
                        <div class="text-xs font-medium text-slate-700 break-words">${err.message}</div>
                    </div>`;
            }
        }

        async function bildirimleriKontrolEt() {
            if (!benimEmailim) return;
            try {
                const { data: myIlans } = await _supabase.from('ilanlar').select('id').eq('sahip_email', benimEmailim);
                let bekleyenTeklif = 0;
                if (myIlans && myIlans.length > 0) {
                    const myIlanIds = myIlans.map(i => i.id);
                    const { count } = await _supabase.from('teklifler')
                        .select('*', { count: 'exact', head: true })
                        .in('ilan_id', myIlanIds)
                        .eq('durum', 'Bekliyor')
                        .neq('teklif_veren_email', benimEmailim);
                    bekleyenTeklif = count || 0;
                }

                const { count: mesajCount } = await _supabase.from('mesajlar')
                    .select('*', { count: 'exact', head: true })
                    .eq('alici_email', benimEmailim)
                    .is('okundu', false);
                const okunmamisMesaj = mesajCount || 0;

                const teklifRozetler = document.querySelectorAll('.nav-teklif-badge');
                teklifRozetler.forEach(el => {
                    el.innerHTML = bekleyenTeklif > 0 ? `<span class="bg-red-600 text-white rounded px-1.5 py-0.5 text-[10px] ml-1.5 font-bold">${bekleyenTeklif}</span>` : '';
                });

                const mesajRozetler = document.querySelectorAll('.nav-mesaj-badge');
                mesajRozetler.forEach(el => {
                    el.innerHTML = okunmamisMesaj > 0 ? `<span class="bg-red-600 text-white rounded px-1.5 py-0.5 text-[10px] ml-1.5 font-bold">${okunmamisMesaj}</span>` : '';
                });
            } catch (err) {
                console.error("Radar hatası:", err);
            }
        }

        async function mesajlariOkunduIsaretle(teklifId) {
            try {
                await _supabase.from('mesajlar')
                    .update({ okundu: true })
                    .eq('teklif_id', teklifId)
                    .eq('alici_email', benimEmailim)
                    .is('okundu', false);
            } catch (err) {
                console.error("Okundu isaretleme hatasi", err);
            }
        }

        async function sohbetListesiniCek() {
            try {
                const { data: gidenler, error: gidenErr } = await _supabase.from('teklifler')
                    .select('id, ilan_id, teklif_veren_email, durum, ilan_sahibi_onay, teklif_veren_onay, ilan_sahibi_puan, teklif_veren_puan, teklif_edilen_ilan_id, teklif_nakit')
                    .eq('teklif_veren_email', benimEmailim)
                    .in('durum', ['Kabul Edildi', 'Tamamlandı', 'Bekliyor']);

                if (gidenErr) throw gidenErr;

                const { data: ilanlarim, error: ilanErr } = await _supabase.from('ilanlar').select('id, baslik, resim_url, sahip_email').eq('sahip_email', benimEmailim);
                if (ilanErr) throw ilanErr;

                const benimIlanIdleri = ilanlarim ? ilanlarim.map(i => i.id) : [];

                let gelenler = [];
                if (benimIlanIdleri.length > 0) {
                    const { data, error: gelenErr } = await _supabase.from('teklifler')
                        .select('id, ilan_id, teklif_veren_email, durum, ilan_sahibi_onay, teklif_veren_onay, ilan_sahibi_puan, teklif_veren_puan, teklif_edilen_ilan_id, teklif_nakit')
                        .in('ilan_id', benimIlanIdleri)
                        .in('durum', ['Kabul Edildi', 'Tamamlandı', 'Bekliyor']);
                    if (gelenErr) throw gelenErr;
                    gelenler = data || [];
                }

                const birlesikTeklifler = [...(gidenler || []), ...gelenler];

                if (birlesikTeklifler.length === 0) {
                    document.getElementById('sohbet-listesi').innerHTML = `<div class="p-6 text-center text-slate-500 font-bold text-xs uppercase tracking-wider border border-slate-200 rounded m-2 bg-slate-50">Henüz sohbetiniz yok.</div>`;
                    return;
                }

                const { data: okunmamisData } = await _supabase.from('mesajlar')
                    .select('teklif_id')
                    .eq('alici_email', benimEmailim)
                    .is('okundu', false);

                const okunmamisMap = {};
                if (okunmamisData) {
                    okunmamisData.forEach(m => { okunmamisMap[m.teklif_id] = (okunmamisMap[m.teklif_id] || 0) + 1; });
                }

                const tumİlgiliIlanIdleri = [...new Set([
                    ...birlesikTeklifler.map(t => t.ilan_id),
                    ...birlesikTeklifler.map(t => t.teklif_edilen_ilan_id).filter(id => id != null)
                ])];

                const { data: tumIlanDetaylari, error: detayErr } = await _supabase.from('ilanlar').select('id, baslik, resim_url, sahip_email').in('id', tumİlgiliIlanIdleri);
                if (detayErr) throw detayErr;

                tumSohbetler = birlesikTeklifler.map(teklif => {
                    const ilan = tumIlanDetaylari?.find(i => i.id === teklif.ilan_id);
                    const teklifEdilenIlan = tumIlanDetaylari?.find(i => i.id === teklif.teklif_edilen_ilan_id);

                    if (!ilan) return null;

                    const isBenimIlanim = ilan.sahip_email === benimEmailim;
                    const karsiEmail = isBenimIlanim ? teklif.teklif_veren_email : ilan.sahip_email;

                    return {
                        teklif_id: teklif.id,
                        karsi_email: karsiEmail,
                        is_benim_ilanim: isBenimIlanim,
                        ilan_detay: ilan,
                        teklif_edilen_ilan_detay: teklifEdilenIlan || null,
                        teklif_nakit: teklif.teklif_nakit || 0,
                        ilan_sahibi_onay: teklif.ilan_sahibi_onay,
                        teklif_veren_onay: teklif.teklif_veren_onay,
                        durum: teklif.durum,
                        ben_puan_verdim_mi: isBenimIlanim ? (teklif.teklif_veren_puan != null) : (teklif.ilan_sahibi_puan != null),
                        okunmamis_sayisi: okunmamisMap[teklif.id] || 0
                    };
                }).filter(s => s !== null);

                if (tumSohbetler.length === 0) {
                    document.getElementById('sohbet-listesi').innerHTML = `<div class="p-6 text-center text-slate-500 font-bold text-xs uppercase tracking-wider border border-slate-200 rounded m-2 bg-slate-50">Tüm sohbetlere ait ilanlar silinmiş.</div>`;
                    return;
                }

                listeyiCiz();

            } catch (e) {
                console.error("Sohbet çekme hatası:", e);
                document.getElementById('sohbet-listesi').innerHTML = `
                    <div class="p-4 m-2 bg-red-50 border border-red-200 rounded text-center">
                        <div class="text-red-700 font-extrabold text-xs uppercase tracking-wider mb-1.5 border-b border-red-200 pb-1.5">Veritabanı Hatası</div>
                        <div class="text-xs font-medium text-slate-700 break-words">${e.message}</div>
                    </div>`;
            }
        }

        function listeyiCiz() {
            let html = "";
            tumSohbetler.forEach(sohbet => {
                const ilkResim = sohbet.ilan_detay.resim_url ? sohbet.ilan_detay.resim_url.split(',')[0] : "";
                const karsiIsim = sohbet.karsi_email.split('@')[0].toUpperCase();

                const durumRozeti = sohbet.durum === 'Tamamlandı'
                    ? `<span class="inline-flex items-center gap-1 bg-emerald-950 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded-sm text-[9px] font-bold uppercase tracking-wider ml-2 flex-shrink-0">✓ Takaslandı</span>`
                    : '';

                const aktifClass = sohbet.teklif_id == aktifTeklifId
                    ? 'bg-slate-100 border-l-4 border-l-[#0f172a] border-slate-300'
                    : 'bg-white border-slate-200 hover:bg-slate-50 hover:border-slate-300';
                const metinClass = sohbet.okunmamis_sayisi > 0 ? 'text-slate-900 font-bold' : 'text-slate-500 font-medium';
                const okunmamisRozet = sohbet.okunmamis_sayisi > 0
                    ? `<div class="bg-red-600 text-white min-w-[20px] h-5 px-1.5 flex items-center justify-center rounded-sm text-[10px] font-extrabold ml-auto flex-shrink-0">${sohbet.okunmamis_sayisi}</div>`
                    : '';

                html += `
                <div onclick="sohbetiAc('${sohbet.teklif_id}', '${sohbet.karsi_email}', '${sohbet.ilan_detay.baslik.replace(/'/g, "\\'")}', '${ilkResim}')" class="flex items-center gap-3 p-3 rounded border cursor-pointer transition-colors ${aktifClass} sohbet-item" id="btn-sohbet-${sohbet.teklif_id}">
                    <div class="w-11 h-11 rounded-sm bg-slate-200 overflow-hidden flex-shrink-0 border border-slate-300 relative">
                        ${ilkResim ? `<img src="${ilkResim}" onerror="this.style.display='none'" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[9px] font-bold text-slate-500">YOK</div>`}
                    </div>
                    <div class="flex-grow min-w-0 pr-1">
                        <h4 class="font-extrabold text-xs sm:text-sm text-slate-900 truncate flex items-center">${karsiIsim}${durumRozeti}</h4>
                        <p class="text-[11px] ${metinClass} truncate mt-0.5">İlan: ${sohbet.ilan_detay.baslik}</p>
                    </div>
                    ${okunmamisRozet}
                </div>`;
            });
            document.getElementById('sohbet-listesi').innerHTML = html;
        }

        async function sohbetiAc(teklifId, karsiEmail, ilanBaslik, ilanResim) {
            aktifTeklifId = teklifId;
            aktifKarsiEmail = karsiEmail;

            const seciliSohbet = tumSohbetler.find(s => s.teklif_id == teklifId);
            onayDurumunuGuncelle(seciliSohbet);

            if (seciliSohbet) {
                seciliSohbet.okunmamis_sayisi = 0;
                listeyiCiz();
            }

            const solPanel = document.querySelector('.md\\:w-1\\/3');
            if (window.innerWidth < 768) { solPanel.classList.add('hidden'); }
            document.getElementById('sohbet-alani').classList.remove('hidden');
            document.getElementById('sohbet-alani').classList.add('flex');

            document.getElementById('sohbet-bos').classList.add('hidden');
            document.getElementById('header-ilan-baslik').innerText = ilanBaslik;
            document.getElementById('header-karsi-isim').innerText = karsiEmail.split('@')[0].toUpperCase();

            document.getElementById('mesaj-gonderme-formu').classList.remove('hidden');
            document.getElementById('mesaj-gonderme-formu').classList.add('flex');

            if (ilanResim) { document.getElementById('header-ilan-resim').src = ilanResim; }
            else { document.getElementById('header-ilan-resim').src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none"><rect width="100%" height="100%" fill="%23e2e8f0"/></svg>'; }

            document.getElementById('mesajlar-kutusu').innerHTML = `<div class="text-center text-xs font-bold text-slate-500 mt-10">Mesajlar yükleniyor...</div>`;

            await mesajlariOkunduIsaretle(teklifId);
            bildirimleriKontrolEt();

            eskiMesajlariGetir(seciliSohbet);
            canliYayinAboneligiBaslat();
        }

        function onayDurumunuGuncelle(sohbet) {
            const isBenimIlanim = sohbet.is_benim_ilanim;
            const benimOnayim = isBenimIlanim ? sohbet.ilan_sahibi_onay : sohbet.teklif_veren_onay;
            const karsiOnay = isBenimIlanim ? sohbet.teklif_veren_onay : sohbet.ilan_sahibi_onay;

            const sagKisim = document.getElementById('header-sag-kisim');

            if (sohbet.durum === 'Tamamlandı') {
                if (sohbet.ben_puan_verdim_mi) {
                    sagKisim.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider hidden md:inline">Değerlendirildi</span>
                            <div class="bg-emerald-50 text-emerald-700 px-2.5 py-1.5 rounded-sm font-extrabold text-[10px] md:text-xs uppercase tracking-wider flex items-center gap-1 border border-emerald-300">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                <span>Takaslandı</span>
                            </div>
                        </div>`;
                } else {
                    sagKisim.innerHTML = `
                        <div class="flex items-center gap-2">
                            <button onclick="degerlendirmeModalAc()" class="bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] px-3 py-2 rounded font-extrabold text-[10px] md:text-xs uppercase tracking-wider transition-colors flex items-center gap-1 cursor-pointer">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                                <span>Değerlendir</span>
                            </button>
                            <div class="bg-emerald-50 text-emerald-700 px-2.5 py-2 rounded-sm font-extrabold text-[10px] md:text-xs uppercase tracking-wider items-center gap-1 border border-emerald-300 hidden md:flex">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                <span>Takaslandı</span>
                            </div>
                        </div>`;
                }
            } else if (benimOnayim) {
                sagKisim.innerHTML = `
                    <div class="bg-amber-50 text-amber-800 px-2.5 py-1.5 rounded-sm font-bold text-[10px] uppercase tracking-wider text-right border border-amber-300 leading-tight">
                        Karşı Onay<br><span class="font-extrabold">Bekleniyor</span>
                    </div>`;
            } else if (karsiOnay) {
                sagKisim.innerHTML = `
                    <button onclick="onayVer()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded font-extrabold text-[10px] md:text-xs uppercase tracking-wider transition-colors flex items-center gap-1.5 cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        <span class="hidden sm:inline">Karşısı Onayladı — Sıra Sende</span>
                        <span class="sm:hidden">Sıra Sende</span>
                    </button>`;
            } else {
                sagKisim.innerHTML = `
                    <button onclick="onayVer()" class="bg-[#0f172a] hover:bg-black text-[#facc15] px-3 py-2 rounded font-extrabold text-[10px] md:text-xs uppercase tracking-wider transition-colors flex items-center gap-1.5 cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span class="hidden sm:inline">Takası Onayla</span>
                        <span class="sm:hidden">Onayla</span>
                    </button>`;
            }
        }

        async function onayVer() {
            const sohbet = tumSohbetler.find(s => s.teklif_id == aktifTeklifId);
            const isBenimIlanim = sohbet.is_benim_ilanim;

            const guncellemeData = isBenimIlanim ? { ilan_sahibi_onay: true } : { teklif_veren_onay: true };

            document.getElementById('header-sag-kisim').innerHTML = '<span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">İşleniyor...</span>';

            try {
                const { error } = await _supabase.from('teklifler').update(guncellemeData).eq('id', aktifTeklifId);
                if (error) throw error;

                const { data: guncelTeklif } = await _supabase.from('teklifler').select('*').eq('id', aktifTeklifId).single();

                if (guncelTeklif.ilan_sahibi_onay && guncelTeklif.teklif_veren_onay) {
                    finalKapatma(guncelTeklif.ilan_id, aktifTeklifId, guncelTeklif.teklif_edilen_ilan_id);
                } else {
                    modalAc("ONAY ALINDI", "Takas onayınız başarıyla sisteme kaydedildi. Karşı taraf da onayladığı an ilan vitrinden kaldırılacaktır.", "basarili");
                    await sohbetListesiniCek();
                }
            } catch (err) {
                console.error(err);
                modalAc("HATA", "Onay verilirken bir sorun oluştu.", "hata");
            }
        }

        async function finalKapatma(ilanId, teklifId, teklifEdilenIlanId) {
            try {
                await _supabase.from('ilanlar').update({ durum: 'Takaslandı' }).eq('id', ilanId);
                if (teklifEdilenIlanId) {
                    await _supabase.from('ilanlar').update({ durum: 'Takaslandı' }).eq('id', teklifEdilenIlanId);
                }

                await _supabase.from('teklifler').update({ durum: 'Tamamlandı' }).eq('id', teklifId);

                modalAc("TEBRİKLER!", "Her iki taraf da onay verdi ve takas başarıyla tamamlandı! Lütfen şimdi karşı tarafın profilinde görünecek Güven Skorunu belirlemek için ticareti değerlendirin.", "basarili", false, async () => {
                    await sohbetListesiniCek();
                    degerlendirmeModalAc();
                });
            } catch (err) {
                console.error("Kapatma işlemi başarısız:", err);
            }
        }

        function degerlendirmeModalAc() {
            secilenPuan = 0;
            yildizCek();
            document.getElementById('degerlendirme-yorum').value = "";

            document.getElementById('degerlendirme-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('degerlendirme-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        function degerlendirmeModalKapat() {
            document.getElementById('degerlendirme-modal-kutu').classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('degerlendirme-modal').classList.add('hidden'); }, 200);
        }

        function yildizHover(puan) {
            const yildizlar = document.querySelectorAll('.star-btn');
            yildizlar.forEach((y, i) => {
                if (i < puan) y.style.color = '#facc15';
                else if (i >= secilenPuan) y.style.color = '#cbd5e1';
            });
        }

        function yildizCek() {
            const yildizlar = document.querySelectorAll('.star-btn');
            yildizlar.forEach((y, i) => {
                if (i < secilenPuan) y.style.color = '#facc15';
                else y.style.color = '#cbd5e1';
            });
        }

        function puanVer(puan) {
            secilenPuan = puan;
            yildizCek();
        }

        async function degerlendirmeGonder() {
            if (secilenPuan === 0) { alert("Lütfen bir yıldız puanı seçin."); return; }

            const yorum = document.getElementById('degerlendirme-yorum').value.trim();
            const btn = document.getElementById('degerlendirme-gonder-btn');

            btn.disabled = true; btn.innerHTML = "KAYDEDİLİYOR...";

            const sohbet = tumSohbetler.find(s => s.teklif_id == aktifTeklifId);
            const isBenimIlanim = sohbet.is_benim_ilanim;

            const guncellemeData = isBenimIlanim
                ? { teklif_veren_puan: secilenPuan, teklif_veren_yorum: yorum }
                : { ilan_sahibi_puan: secilenPuan, ilan_sahibi_yorum: yorum };

            try {
                const { error } = await _supabase.from('teklifler').update(guncellemeData).eq('id', aktifTeklifId);
                if (error) throw error;

                degerlendirmeModalKapat();
                modalAc("BAŞARILI", "Değerlendirmeniz kaydedildi! Karşı tarafın Güven Skoruna katkıda bulundunuz.", "basarili");
                await sohbetListesiniCek();

            } catch (err) {
                console.error(err);
                modalAc("HATA", "Değerlendirme kaydedilirken bir sorun oluştu.", "hata");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>Değerlendirmeyi Gönder`;
            }
        }

        function solaDon() {
            document.querySelector('.md\\:w-1\\/3').classList.remove('hidden');
            document.getElementById('sohbet-alani').classList.add('hidden');
            document.getElementById('sohbet-alani').classList.remove('flex');
        }

        function canliYayinAboneligiBaslat() {
            if (realtimeAbonelik) { _supabase.removeChannel(realtimeAbonelik); }
            realtimeAbonelik = _supabase.channel('custom-all-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mesajlar' }, async (payload) => {

                    if (payload.new.teklif_id == aktifTeklifId) {
                        mesajiEkranaCiz(payload.new);

                        if (payload.new.alici_email === benimEmailim) {
                            await mesajlariOkunduIsaretle(aktifTeklifId);
                            bildirimleriKontrolEt();
                        }
                    } else {
                        if (payload.new.alici_email === benimEmailim) {
                            bildirimleriKontrolEt();

                            const chat = tumSohbetler.find(s => s.teklif_id == payload.new.teklif_id);
                            if (chat) {
                                chat.okunmamis_sayisi = (chat.okunmamis_sayisi || 0) + 1;
                                listeyiCiz();
                            } else {
                                sohbetListesiniCek();
                            }
                        }
                    }
                }).subscribe();
        }

        async function eskiMesajlariGetir(seciliSohbet) {
            if (!aktifTeklifId) return;
            const kutu = document.getElementById('mesajlar-kutusu');

            let teklifKartHtml = "";
            if (seciliSohbet.teklif_edilen_ilan_detay) {
                const sunulanEsya = seciliSohbet.teklif_edilen_ilan_detay;
                const sunulanEsyaResim = sunulanEsya.resim_url ? sunulanEsya.resim_url.split(',')[0] : '';
                const sunulanEsyaBaslik = sunulanEsya.baslik;
                const nakitStr = Number(seciliSohbet.teklif_nakit || 0).toLocaleString('tr-TR');
                const nakitMetni = seciliSohbet.teklif_nakit > 0
                    ? `<div class="bg-emerald-500/15 text-emerald-400 px-3 py-1.5 rounded-sm border border-emerald-500/30 font-extrabold text-xs tracking-wide mt-3 flex items-center justify-center gap-1.5">+ ${nakitStr} ₺ Nakit Fark</div>`
                    : '';

                const kartBaslik = seciliSohbet.is_benim_ilanim
                    ? `Size Sunulan Takas Teklifi`
                    : `Sizin Sunduğunuz Takas Teklifi`;

                teklifKartHtml = `
                <div class="w-full bg-[#0f172a] rounded-md border border-slate-800 p-3.5 sm:p-4 mb-3 flex-shrink-0">
                    <div class="text-[10px] font-extrabold text-[#facc15] uppercase tracking-wider mb-2.5">${kartBaslik}</div>

                    <a href="detay.html?id=${sunulanEsya.id}" target="_blank" class="flex items-center gap-3 bg-slate-800/70 hover:bg-slate-800 p-2.5 rounded border border-slate-700 transition-colors cursor-pointer group">
                        <div class="w-11 h-11 rounded-sm bg-slate-700 overflow-hidden flex-shrink-0">
                            ${sunulanEsyaResim ? `<img src="${sunulanEsyaResim}" onerror="this.style.display='none'" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[9px] text-slate-400 font-bold">YOK</div>`}
                        </div>
                        <div class="text-white min-w-0 flex-1 pr-2">
                            <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Verilecek Eşya</p>
                            <h4 class="font-bold text-xs sm:text-sm truncate group-hover:text-[#facc15] transition-colors">${sunulanEsyaBaslik}</h4>
                        </div>
                        <div class="flex-shrink-0 text-slate-400 group-hover:text-[#facc15] transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </a>

                    ${nakitMetni}
                </div>`;
            } else {
                teklifKartHtml = `
                <div class="w-full bg-white rounded border border-slate-200 p-3 mb-3 text-center text-[11px] font-semibold text-slate-500">
                    Bu teklifte eşya seçimi yapılmamış (Eski sistem).
                </div>`;
            }

            try {
                const { data, error } = await _supabase.from('mesajlar').select('*').eq('teklif_id', aktifTeklifId).order('created_at', { ascending: true });
                if (error) throw error;

                if (!data || data.length === 0) {
                    kutu.innerHTML = teklifKartHtml + `<div class="text-center text-xs font-semibold text-slate-500 bg-white px-4 py-2.5 rounded mx-auto w-fit mt-2 border border-slate-200 baslangic-mesaji">Detayları konuşmak için ilk mesajı gönderin.</div>`;
                    return;
                }

                kutu.innerHTML = teklifKartHtml;
                data.forEach(m => mesajiEkranaCiz(m));

            } catch (err) {
                console.error("Mesajlar alınamadı: ", err);
            }
        }

        function mesajiEkranaCiz(m) {
            const kutu = document.getElementById('mesajlar-kutusu');
            const baslangicMesaji = kutu.querySelector('.baslangic-mesaji');
            if (baslangicMesaji) baslangicMesaji.remove();

            const benMiyim = m.gonderen_email === benimEmailim;
            const hizalama = benMiyim ? "justify-end" : "justify-start";
            const renkClass = benMiyim ? "mesaj-giden" : "mesaj-gelen border border-slate-200";
            const saat = new Date(m.created_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

            const html = `
            <div class="w-full flex ${hizalama} mesaj-satiri flex-shrink-0">
                <div class="max-w-[85%] md:max-w-[70%] px-3.5 py-2.5 rounded-md ${renkClass} relative">
                    <p class="text-sm font-medium leading-relaxed break-words">${m.mesaj}</p>
                    <span class="text-[10px] font-semibold opacity-60 block text-right mt-1">${saat}</span>
                </div>
            </div>`;

            kutu.insertAdjacentHTML('beforeend', html);
            kutu.scrollTop = kutu.scrollHeight;
        }

        async function mesajGonder(event) {
            event.preventDefault();
            const input = document.getElementById('mesaj-input');
            const btn = document.getElementById('gonder-btn');
            const mesaj = input.value.trim();

            if (!mesaj || !aktifTeklifId || !aktifKarsiEmail) return;

            input.disabled = true; btn.disabled = true;

            try {
                const { error } = await _supabase.from('mesajlar').insert([{
                    teklif_id: aktifTeklifId,
                    gonderen_email: benimEmailim,
                    alici_email: aktifKarsiEmail,
                    mesaj: mesaj
                }]);

                if (error) throw error;
                input.value = "";
            } catch (e) {
                console.error(e);
            } finally {
                input.disabled = false; btn.disabled = false; input.focus();
            }
        }

        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }

        function menuOlusturGuncel(session) {
            const menuDiv = document.getElementById('auth-menu');
            const mobilTopDiv = document.getElementById('auth-menu-mobil');
            const mobileMenu = document.getElementById('mobile-menu');

            let gorunenIsim = "Kullanıcı";
            if (session && session.user) {
                const meta = session.user.user_metadata || {};
                gorunenIsim = meta.ad_soyad ? meta.ad_soyad : session.user.email.split('@')[0];
            }

            menuDiv.innerHTML = `
                <a href="profil.html" class="text-[#facc15] font-bold text-xs uppercase tracking-wider flex items-center gap-1.5 hover:text-yellow-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    ${gorunenIsim}
                </a>
                <a href="favorilerim.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">Favorilerim</a>
                <a href="ilanlarim.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">İlanlarım</a>
                <a href="sohbetler.html" class="text-white font-extrabold text-xs border-b-2 border-[#facc15] pb-0.5 flex items-center">Mesajlar <span class="nav-mesaj-badge"></span></a>
                <a href="teklifler.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors flex items-center">Teklifler <span class="nav-teklif-badge"></span></a>
                <span class="text-slate-700">|</span>
                <button onclick="cikisYap()" class="text-slate-400 font-semibold text-xs hover:text-red-400 transition-colors cursor-pointer">Çıkış</button>
                <a href="ilan-ver.html" class="bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] px-4 py-2 rounded font-extrabold text-xs uppercase tracking-wider transition-colors">+ İlan Ver</a>
            `;

            mobilTopDiv.innerHTML = `
                <a href="ilan-ver.html" class="bg-[#facc15] text-[#0b1120] px-3 py-1.5 rounded font-extrabold text-[11px] uppercase">+ İlan Ver</a>
                <button onclick="toggleMobileMenu()" class="text-white p-1.5 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            `;

            mobileMenu.innerHTML = `
                <a href="profil.html" class="block px-5 py-3.5 text-[#facc15] font-bold text-xs uppercase border-b border-slate-800">${gorunenIsim}</a>
                <a href="favorilerim.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">Favorilerim</a>
                <a href="ilanlarim.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">İlanlarım</a>
                <a href="sohbetler.html" class="px-5 py-3.5 text-[#facc15] font-extrabold text-xs border-b border-slate-800 flex items-center justify-between"><span>Mesajlar</span> <span class="nav-mesaj-badge"></span></a>
                <a href="teklifler.html" class="px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800 flex items-center justify-between"><span>Teklifler</span> <span class="nav-teklif-badge"></span></a>
                <button onclick="cikisYap()" class="w-full text-left block px-5 py-3.5 text-red-400 font-semibold text-xs">Çıkış Yap</button>
            `;
        }

        function modalAc(baslik, mesaj, tip, isIptal = false, onayFonk = null) {
            document.getElementById('modal-baslik').innerText = baslik; document.getElementById('modal-mesaj').innerText = mesaj;
            const ikon = document.getElementById('modal-ikon');
            if (tip === 'basarili') { ikon.className = "mx-auto h-12 w-12 rounded-md bg-emerald-50 flex items-center justify-center text-emerald-600 font-extrabold text-xl border border-emerald-200 mb-4"; ikon.innerHTML = "✓"; }
            else if (tip === 'hata') { ikon.className = "mx-auto h-12 w-12 rounded-md bg-red-50 flex items-center justify-center text-red-600 font-extrabold text-xl border border-red-200 mb-4"; ikon.innerHTML = "!"; }
            else { ikon.className = "mx-auto h-12 w-12 rounded-md bg-amber-50 flex items-center justify-center text-amber-600 font-extrabold text-xl border border-amber-200 mb-4"; ikon.innerHTML = "?"; }
            if (isIptal) { document.getElementById('modal-btn-ikincil').classList.remove('hidden'); document.getElementById('modal-btn-ana').onclick = () => { modalKapat(); if (onayFonk) onayFonk(); }; }
            else { document.getElementById('modal-btn-ikincil').classList.add('hidden'); document.getElementById('modal-btn-ana').innerText = "Tamam"; document.getElementById('modal-btn-ana').onclick = () => { modalKapat(); if (onayFonk) onayFonk(); }; }
            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        function modalKapat() { document.getElementById('ozel-modal-kutu').classList.add('scale-95', 'opacity-0'); setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 200); }
        async function cikisYap() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }

        sitemiCalistir();
    </script>
</body>
