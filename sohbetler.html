<!DOCTYPE html>

    <style>

        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

<body class="bg-gray-100 font-sans h-[100dvh] flex flex-col overflow-hidden w-full">

    <nav class="bg-[#0f172a] px-6 py-4 flex justify-between items-center w-full shadow-md z-50 flex-shrink-0 relative">

    <main class="flex-1 flex max-w-7xl mx-auto w-full p-2 md:p-4 gap-4 overflow-hidden min-h-0">

            <div id="sohbet-bos" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 z-10">

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let benimEmailim = "";
        let tumSohbetler = [];
        let aktifTeklifId = null;
        let aktifKarsiEmail = "";
        let realtimeAbonelik = null; 
        let secilenPuan = 0;

        async function sitemiCalistir() {
            try {
                const { data: { session }, error } = await _supabase.auth.getSession();
                if (error) throw error;
                if (!session) { window.location.href = 'giris.html'; return; }
                
                benimEmailim = session.user.email;
                menuOlusturGuncel(session);
                
                await sohbetListesiniCek();
            } catch (err) {
                console.error("Sistem Başlatma Hatası:", err);
                document.getElementById('sohbet-listesi').innerHTML = `
                    <div class="p-4 m-2 bg-red-50 border border-red-200 rounded-xl text-center shadow-sm">
                        <div class="text-red-600 font-black text-xs uppercase tracking-widest mb-2 border-b border-red-200 pb-2">Kritik Bir Hata Oluştu!</div>
                        <div class="text-[10px] font-bold text-gray-700 break-words">${err.message}</div>
                    </div>`;
            }
        }

        async function sohbetListesiniCek() {
            try {
                const { data: gidenler, error: gidenErr } = await _supabase.from('teklifler')
                    .select('id, ilan_id, teklif_veren_email, durum, ilan_sahibi_onay, teklif_veren_onay, ilan_sahibi_puan, teklif_veren_puan, teklif_edilen_ilan_id, teklif_nakit')
                    .eq('teklif_veren_email', benimEmailim)
                    .in('durum', ['Kabul Edildi', 'Tamamlandı', 'Bekliyor']);
                
                if(gidenErr) throw gidenErr;
                
                const { data: ilanlarim, error: ilanErr } = await _supabase.from('ilanlar').select('id, baslik, resim_url, sahip_email').eq('sahip_email', benimEmailim);
                if(ilanErr) throw ilanErr;

                const benimIlanIdleri = ilanlarim ? ilanlarim.map(i => i.id) : [];
                
                let gelenler = [];
                if(benimIlanIdleri.length > 0) {
                    const { data, error: gelenErr } = await _supabase.from('teklifler')
                        .select('id, ilan_id, teklif_veren_email, durum, ilan_sahibi_onay, teklif_veren_onay, ilan_sahibi_puan, teklif_veren_puan, teklif_edilen_ilan_id, teklif_nakit')
                        .in('ilan_id', benimIlanIdleri)
                        .in('durum', ['Kabul Edildi', 'Tamamlandı', 'Bekliyor']);
                    if(gelenErr) throw gelenErr;
                    gelenler = data || [];
                }

                const birlesikTeklifler = [...(gidenler || []), ...gelenler];

                if(birlesikTeklifler.length === 0) {
                    document.getElementById('sohbet-listesi').innerHTML = `<div class="p-6 text-center text-gray-400 font-bold text-[10px] uppercase tracking-widest border-2 border-dashed border-gray-100 rounded-xl m-2">Henüz sohbetiniz yok.</div>`;
                    return;
                }

                const tumİlgiliIlanIdleri = [...new Set([
                    ...birlesikTeklifler.map(t => t.ilan_id),
                    ...birlesikTeklifler.map(t => t.teklif_edilen_ilan_id).filter(id => id != null)
                ])];

                const { data: tumIlanDetaylari, error: detayErr } = await _supabase.from('ilanlar').select('id, baslik, resim_url, sahip_email').in('id', tumİlgiliIlanIdleri);
                if(detayErr) throw detayErr;

                tumSohbetler = birlesikTeklifler.map(teklif => {
                    const ilan = tumIlanDetaylari?.find(i => i.id === teklif.ilan_id);
                    const teklifEdilenIlan = tumIlanDetaylari?.find(i => i.id === teklif.teklif_edilen_ilan_id); 
                    
                    if(!ilan) return null; 
                    
                    const isBenimIlanim = ilan.sahip_email === benimEmailim;
                    const karsiEmail = isBenimIlanim ? teklif.teklif_veren_email : ilan.sahip_email;

                    return {
                        teklif_id: teklif.id,
                        karsi_email: karsiEmail,
                        is_benim_ilanim: isBenimIlanim,
                        ilan_detay: ilan,
                        teklif_edilen_ilan_detay: teklifEdilenIlan || null,
                        teklif_nakit: teklif.teklif_nakit || 0,
                        ilan_sahibi_onay: teklif.ilan_sahibi_onay,
                        teklif_veren_onay: teklif.teklif_veren_onay,
                        durum: teklif.durum,
                        ben_puan_verdim_mi: isBenimIlanim ? (teklif.teklif_veren_puan != null) : (teklif.ilan_sahibi_puan != null) 
                    };
                }).filter(s => s !== null);

                if(tumSohbetler.length === 0) {
                     document.getElementById('sohbet-listesi').innerHTML = `<div class="p-6 text-center text-gray-400 font-bold text-[10px] uppercase tracking-widest border-2 border-dashed border-gray-100 rounded-xl m-2">Tüm sohbetlere ait ilanlar silinmiş.</div>`;
                     return;
                }

                listeyiCiz();

            } catch(e) {
                console.error("Sohbet çekme hatası:", e);
                document.getElementById('sohbet-listesi').innerHTML = `
                    <div class="p-4 m-2 bg-red-50 border border-red-200 rounded-xl text-center shadow-sm">
                        <div class="text-red-600 font-black text-xs uppercase tracking-widest mb-2 border-b border-red-200 pb-2">Veritabanı Hatası!</div>
                        <div class="text-[10px] font-bold text-gray-700 break-words">${e.message}</div>
                    </div>`;
            }
        }

        function listeyiCiz() {
            let html = "";
            tumSohbetler.forEach(sohbet => {
                const ilkResim = sohbet.ilan_detay.resim_url ? sohbet.ilan_detay.resim_url.split(',')[0] : "";
                const karsiIsim = sohbet.karsi_email.split('@')[0].toUpperCase();
                
                const durumRozeti = sohbet.durum === 'Tamamlandı' ? `<span class="inline-flex items-center gap-1 bg-[#0f172a] text-[#34d399] px-2 py-0.5 rounded-md text-[8px] md:text-[9px] font-black uppercase tracking-widest ml-2 align-middle shadow-sm"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>TAKASLANDI</span>` : '';
                
                html += `
                <div onclick="sohbetiAc('${sohbet.teklif_id}', '${sohbet.karsi_email}', '${sohbet.ilan_detay.baslik.replace(/'/g, "\\'")}', '${ilkResim}')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-100 cursor-pointer transition-colors border border-transparent hover:border-gray-200 sohbet-item" id="btn-sohbet-${sohbet.teklif_id}">
                    <div class="w-12 h-12 rounded-full bg-gray-200 overflow-hidden flex-shrink-0 border-2 border-white shadow-sm">
                        ${ilkResim ? `<img src="${ilkResim}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[8px] font-bold text-gray-500">YOK</div>`}
                    </div>
                    <div class="flex-grow min-w-0">
                        <h4 class="font-black text-sm text-[#0f172a] truncate flex items-center">${karsiIsim}${durumRozeti}</h4>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest truncate mt-0.5">İlan: ${sohbet.ilan_detay.baslik}</p>
                    </div>
                </div>`;
            });
            document.getElementById('sohbet-listesi').innerHTML = html;
        }

        function sohbetiAc(teklifId, karsiEmail, ilanBaslik, ilanResim) {
            aktifTeklifId = teklifId;
            aktifKarsiEmail = karsiEmail;

            const seciliSohbet = tumSohbetler.find(s => s.teklif_id == teklifId);

            document.getElementById('mesaj-gonderme-formu').classList.add('flex');

            else { document.getElementById('header-ilan-resim').src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none"><rect width="100%" height="100%" fill="%23f3f4f6"/></svg>'; }

            canliYayinAboneligiBaslat(); 
        }

        function onayDurumunuGuncelle(sohbet) {
            const isBenimIlanim = sohbet.is_benim_ilanim;
            const benimOnayim = isBenimIlanim ? sohbet.ilan_sahibi_onay : sohbet.teklif_veren_onay;
            const karsiOnay = isBenimIlanim ? sohbet.teklif_veren_onay : sohbet.ilan_sahibi_onay;

                sagKisim.innerHTML = `
                    <button onclick="onayVer()" class="bg-green-500 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-black text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-green-600 transition-colors shadow-md flex items-center gap-1.5 animate-pulse">

                        <span class="hidden sm:inline">KARŞISI ONAYLADI! SIRA SENDE</span>
                        <span class="sm:hidden">SIRA SENDE</span>
                    </button>`;
            } else {
                sagKisim.innerHTML = `
                    <button onclick="onayVer()" class="bg-[#0f172a] text-[#facc15] px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-black text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-black transition-colors shadow-md flex items-center gap-1.5">

        async function onayVer() {
            const sohbet = tumSohbetler.find(s => s.teklif_id == aktifTeklifId);
            const isBenimIlanim = sohbet.is_benim_ilanim;
            
            const guncellemeData = isBenimIlanim ? { ilan_sahibi_onay: true } : { teklif_veren_onay: true };
            
            document.getElementById('header-sag-kisim').innerHTML = '<span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">İŞLENİYOR...</span>';

            try {
                const { error } = await _supabase.from('teklifler').update(guncellemeData).eq('id', aktifTeklifId);
                if (error) throw error;

                const { data: guncelTeklif } = await _supabase.from('teklifler').select('*').eq('id', aktifTeklifId).single();
                
                if (guncelTeklif.ilan_sahibi_onay && guncelTeklif.teklif_veren_onay) {
                    finalKapatma(guncelTeklif.ilan_id, aktifTeklifId, guncelTeklif.teklif_edilen_ilan_id); 
                } else {
                    modalAc("ONAY ALINDI", "Takas onayınız başarıyla sisteme kaydedildi. Karşı taraf da onayladığı an ilan vitrinden kaldırılacaktır.", "basarili");
                    await sohbetListesiniCek(); 
                }
            } catch (err) {
                console.error(err);
                modalAc("HATA", "Onay verilirken bir sorun oluştu.", "hata");
            }
        }

        async function finalKapatma(ilanId, teklifId, teklifEdilenIlanId) {
            try {
                await _supabase.from('ilanlar').update({ durum: 'Takaslandı' }).eq('id', ilanId);
                if(teklifEdilenIlanId) {
                    await _supabase.from('ilanlar').update({ durum: 'Takaslandı' }).eq('id', teklifEdilenIlanId);
                }

                await _supabase.from('teklifler').update({ durum: 'Tamamlandı' }).eq('id', teklifId);
                
                modalAc("TEBRİKLER! 🎉", "Her iki taraf da onay verdi ve takas başarıyla tamamlandı! Lütfen şimdi karşı tarafın profilinde görünecek Güven Skorunu belirlemek için ticareti değerlendirin.", "basarili", false, async () => {
                    await sohbetListesiniCek(); 
                    degerlendirmeModalAc(); 
                });
            } catch (err) {
                console.error("Kapatma işlemi başarısız:", err);
            }
        }

        function degerlendirmeModalAc() {
            secilenPuan = 0;
            yildizCek(); 
            document.getElementById('degerlendirme-yorum').value = ""; 
            
            document.getElementById('degerlendirme-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('degerlendirme-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        function degerlendirmeModalKapat() {
            document.getElementById('degerlendirme-modal-kutu').classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('degerlendirme-modal').classList.add('hidden'); }, 300);
        }

        function yildizHover(puan) {
            const yildizlar = document.querySelectorAll('.star-btn');
            yildizlar.forEach((y, i) => {
                if (i < puan) y.style.color = '#facc15';
                else if (i >= secilenPuan) y.style.color = '#d1d5db';
            });
        }

        function yildizCek() {
            const yildizlar = document.querySelectorAll('.star-btn');
            yildizlar.forEach((y, i) => {
                if (i < secilenPuan) y.style.color = '#facc15';
                else y.style.color = '#d1d5db';
            });
        }

        function puanVer(puan) {
            secilenPuan = puan;
            yildizCek();
        }

        async function degerlendirmeGonder() {
            if (secilenPuan === 0) { alert("Lütfen bir yıldız puanı seçin."); return; }

            const yorum = document.getElementById('degerlendirme-yorum').value.trim();
            const btn = document.getElementById('degerlendirme-gonder-btn');
            
            btn.disabled = true; btn.innerHTML = "KAYDEDİLİYOR...";

            const sohbet = tumSohbetler.find(s => s.teklif_id == aktifTeklifId);
            const isBenimIlanim = sohbet.is_benim_ilanim;
            
            const guncellemeData = isBenimIlanim 
                ? { teklif_veren_puan: secilenPuan, teklif_veren_yorum: yorum } 
                : { ilan_sahibi_puan: secilenPuan, ilan_sahibi_yorum: yorum };

            try {
                const { error } = await _supabase.from('teklifler').update(guncellemeData).eq('id', aktifTeklifId);
                if (error) throw error;

                degerlendirmeModalKapat();
                modalAc("BAŞARILI", "Değerlendirmeniz kaydedildi! Karşı tarafın Güven Skoruna katkıda bulundunuz.", "basarili");
                await sohbetListesiniCek(); 

            } catch (err) {
                console.error(err);
                modalAc("HATA", "Değerlendirme kaydedilirken bir sorun oluştu.", "hata");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>DEĞERLENDİRMEYİ GÖNDER`;
            }
        }

        function solaDon() {
            document.querySelector('.md\\:w-1\\/3').classList.remove('hidden');
            document.getElementById('sohbet-alani').classList.add('hidden');
            document.getElementById('sohbet-alani').classList.remove('flex');
        }

        function canliYayinAboneligiBaslat() {
            if (realtimeAbonelik) { _supabase.removeChannel(realtimeAbonelik); }
            realtimeAbonelik = _supabase.channel('custom-all-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mesajlar' }, (payload) => {
                        if (payload.new.teklif_id == aktifTeklifId) { mesajiEkranaCiz(payload.new); }
                    }
                ).subscribe();
        }

                // DÜZELTME BURADA: a etiketi kullanıldı ve tıklanınca yeni sekmede (target="_blank") ilana gitmesi sağlandı

                            <div class="w-12 h-12 rounded-lg bg-gray-200 overflow-hidden flex-shrink-0">
                                ${sunulanEsyaResim ? `<img src="${sunulanEsyaResim}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[8px] text-gray-500 font-bold">YOK</div>`}

                            <div class="text-white min-w-0 flex-1 pr-2">
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-0.5 group-hover:text-gray-300 transition-colors">VERİLECEK EŞYA</p>

        function mesajiEkranaCiz(m) {
            const kutu = document.getElementById('mesajlar-kutusu');
            const baslangicMesaji = kutu.querySelector('.baslangic-mesaji');
            if(baslangicMesaji) baslangicMesaji.remove();

            const benMiyim = m.gonderen_email === benimEmailim;
            const hizalama = benMiyim ? "justify-end" : "justify-start";
            const renkClass = benMiyim ? "mesaj-giden shadow-md" : "mesaj-gelen border border-gray-200 shadow-sm";
            const saat = new Date(m.created_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

            const html = `
            <div class="w-full flex ${hizalama} mesaj-satiri mb-3 flex-shrink-0">
                <div class="max-w-[85%] md:max-w-[70%] p-3 rounded-2xl ${renkClass} relative group">
                    <p class="text-sm font-medium leading-relaxed">${m.mesaj}</p>
                    <span class="text-[9px] font-bold opacity-50 block text-right mt-1 tracking-widest">${saat}</span>
                </div>
            </div>`;

            kutu.insertAdjacentHTML('beforeend', html);
            kutu.scrollTop = kutu.scrollHeight; 
        }

        async function mesajGonder(event) {
            event.preventDefault();
            const input = document.getElementById('mesaj-input');
            const btn = document.getElementById('gonder-btn');
            const mesaj = input.value.trim();

            if(!mesaj || !aktifTeklifId || !aktifKarsiEmail) return;

            input.disabled = true; btn.disabled = true;

            try {
                const { error } = await _supabase.from('mesajlar').insert([{
                    teklif_id: aktifTeklifId,
                    gonderen_email: benimEmailim,
                    alici_email: aktifKarsiEmail,
                    mesaj: mesaj
                }]);
                
                if (error) throw error;
                input.value = "";
            } catch(e) {
                console.error(e);
            } finally {
                input.disabled = false; btn.disabled = false; input.focus();
            }
        }

        function modalAc(baslik, mesaj, tip, isIptal = false, onayFonk = null) {
            document.getElementById('modal-baslik').innerText = baslik; document.getElementById('modal-mesaj').innerText = mesaj;
            const ikon = document.getElementById('modal-ikon');
            if(tip === 'basarili') { ikon.className = "mx-auto h-16 w-16 rounded-full bg-green-50 flex items-center justify-center text-green-500 font-bold text-2xl border border-green-100"; ikon.innerHTML = "✓"; }
            else if(tip === 'hata') { ikon.className = "mx-auto h-16 w-16 rounded-full bg-red-50 flex items-center justify-center text-red-500 font-bold text-2xl border border-red-100"; ikon.innerHTML = "!"; }
            else { ikon.className = "mx-auto h-16 w-16 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-500 font-bold text-2xl border border-yellow-100"; ikon.innerHTML = "?"; }
            if(isIptal) { document.getElementById('modal-btn-ikincil').classList.remove('hidden'); document.getElementById('modal-btn-ana').onclick = () => { modalKapat(); if(onayFonk) onayFonk(); }; } 
            else { document.getElementById('modal-btn-ikincil').classList.add('hidden'); document.getElementById('modal-btn-ana').innerText = "TAMAM"; document.getElementById('modal-btn-ana').onclick = () => { modalKapat(); if(onayFonk) onayFonk(); }; }
            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        function modalKapat() { document.getElementById('ozel-modal-kutu').classList.add('scale-95', 'opacity-0'); setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 300); }
        async function cikisYap() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }

        sitemiCalistir();
    </script>
</body>
</html>
