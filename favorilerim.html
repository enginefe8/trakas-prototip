<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Favorilerim — Trakas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#f1f5f9] min-h-[100dvh] flex flex-col text-slate-900 antialiased overflow-x-hidden">

    <!-- ÜST MENÜ -->
    <nav class="bg-[#0b1120] border-b border-slate-800 sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-sm px-2 py-0.5 rounded-sm tracking-tighter">TR</span>
                <span class="text-2xl font-black text-white tracking-tight uppercase">TRAKAS</span>
            </a>
            <div id="auth-menu" class="hidden lg:flex items-center gap-6"></div>
            <div id="auth-menu-mobil" class="lg:hidden flex items-center gap-3"></div>
        </div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-[#0b1120] border-t border-slate-800 shadow-2xl flex-col z-50"></div>
    </nav>

    <!-- KOYU BAŞLIK BANDI -->
    <section class="bg-[#0f172a] border-b border-slate-800 w-full">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                    Favori İlanlarım <span class="text-[#facc15]">.</span>
                </h1>
                <p class="text-slate-400 font-medium text-xs sm:text-sm mt-1">
                    Takip ettiğin ve ilgilendiğin ilanları buradan hızlıca incele.
                </p>
            </div>
            <a href="index.html" class="w-fit text-xs font-bold text-slate-300 hover:text-white uppercase tracking-wider flex items-center gap-1.5 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"></path></svg>
                Vitrine Dön
            </a>
        </div>
    </section>

    <!-- ANA İÇERİK -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">
        <div id="favoriler-vitrini" class="space-y-3.5">
            <div class="animate-pulse flex gap-4 bg-white p-4 rounded-md border border-slate-200">
                <div class="w-24 h-24 bg-slate-200 rounded-sm flex-shrink-0"></div>
                <div class="flex-grow py-1 space-y-3">
                    <div class="h-3 bg-slate-200 rounded-sm w-1/4"></div>
                    <div class="h-4 bg-slate-200 rounded-sm w-2/3"></div>
                    <div class="h-4 bg-slate-200 rounded-sm w-1/3"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#0b1120] border-t-2 border-[#facc15] pt-7 pb-[max(1.75rem,env(safe-area-inset-bottom))] w-full mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-xs px-1.5 py-0.5 rounded-sm">TR</span>
                <span class="text-lg font-black text-white tracking-tight uppercase">TRAKAS</span>
                <span class="text-slate-500 text-xs font-medium ml-2">Takas Pazaryeri</span>
            </div>
            <p class="text-slate-500 text-xs font-medium">© 2026 TRAKAS. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- ONAY / BİLGİ MODALI -->
    <div id="ozel-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-slate-950/75" onclick="modalKapat()"></div>
        <div id="ozel-modal-kutu" class="relative bg-white p-6 rounded-md border border-slate-300 shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-200">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-md bg-amber-50 border border-amber-200 mb-4">
                    <svg class="h-6 w-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>
                <h3 id="modal-baslik" class="text-base font-extrabold text-slate-900 mb-2 uppercase tracking-wide">Sistem Uyarısı</h3>
                <p id="modal-mesaj" class="text-slate-600 font-medium text-sm mb-6 leading-relaxed"></p>
                <div class="flex justify-center gap-2.5">
                    <button id="modal-btn-iptal" onclick="modalKapat()" class="hidden flex-1 bg-slate-100 text-slate-800 font-bold px-4 py-3 min-h-[44px] rounded hover:bg-slate-200 transition-colors uppercase text-xs tracking-wider cursor-pointer">İptal</button>
                    <button id="modal-btn-onay" onclick="modalOnayCalistir()" class="flex-1 bg-[#0f172a] text-[#facc15] font-extrabold px-4 py-3 min-h-[44px] rounded hover:bg-black transition-colors uppercase text-xs tracking-wider cursor-pointer">Onayla</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let hafizadakiIslem = null;

        window.modalAc = function(baslik, mesaj, isConfirm, onayFonk) {
            document.getElementById('modal-baslik').innerText = baslik;
            document.getElementById('modal-mesaj').innerText = mesaj;
            hafizadakiIslem = onayFonk;

            const btnIptal = document.getElementById('modal-btn-iptal');
            const btnOnay = document.getElementById('modal-btn-onay');

            if (isConfirm) {
                btnIptal.classList.remove('hidden');
                btnOnay.innerText = "Kaldır";
                btnOnay.className = "flex-1 bg-red-600 hover:bg-red-700 text-white font-extrabold px-4 py-3 min-h-[44px] rounded transition-colors uppercase text-xs tracking-wider cursor-pointer";
            } else {
                btnIptal.classList.add('hidden');
                btnOnay.innerText = "Tamam";
                btnOnay.className = "flex-1 bg-[#0f172a] hover:bg-black text-[#facc15] font-extrabold px-4 py-3 min-h-[44px] rounded transition-colors uppercase text-xs tracking-wider cursor-pointer";
            }

            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0');
                document.getElementById('ozel-modal-kutu').classList.add('scale-100', 'opacity-100');
            }, 10);
        };

        window.modalOnayCalistir = async function() {
            modalKapat();
            if (hafizadakiIslem) {
                await hafizadakiIslem();
                hafizadakiIslem = null;
            }
        };

        window.modalKapat = function() {
            const kutu = document.getElementById('ozel-modal-kutu');
            kutu.classList.remove('scale-100', 'opacity-100');
            kutu.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 200);
        };

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function guvenliMetin(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function fiyatFormatla(deger) {
            const sayi = Number(deger);
            if (isNaN(sayi)) return '0 ₺';
            return sayi.toLocaleString('tr-TR') + ' ₺';
        }

        function vitrinAktifMi(ilan) {
            if (!ilan || !ilan.vitrin_bitis) return false;
            return new Date(ilan.vitrin_bitis).getTime() > Date.now();
        }

        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let benimEmailim = "";

        function menuOlustur(session) {
            const menuDiv = document.getElementById('auth-menu');
            const mobilTopDiv = document.getElementById('auth-menu-mobil');
            const mobileMenu = document.getElementById('mobile-menu');
            const user = session.user;
            const meta = user.user_metadata || {};
            const gorunenIsim = guvenliMetin(meta.ad_soyad ? meta.ad_soyad : user.email.split('@')[0]);

            menuDiv.innerHTML = `
                <a href="profil.html" class="text-[#facc15] font-bold text-xs uppercase tracking-wider flex items-center gap-1.5 hover:text-yellow-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    ${gorunenIsim}
                </a>
                <a href="favorilerim.html" class="text-white font-extrabold text-xs border-b-2 border-[#facc15] pb-0.5">Favorilerim</a>
                <a href="ilanlarim.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">İlanlarım</a>
                <a href="sohbetler.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">Mesajlar</a>
                <a href="teklifler.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">Teklifler</a>
                <span class="text-slate-700">|</span>
                <button onclick="cikisYap()" class="text-slate-400 font-semibold text-xs hover:text-red-400 transition-colors cursor-pointer">Çıkış</button>
                <a href="ilan-ver.html" class="bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] px-4 py-2 rounded font-extrabold text-xs uppercase tracking-wider transition-colors">+ İlan Ver</a>
            `;

            mobilTopDiv.innerHTML = `
                <a href="ilan-ver.html" class="bg-[#facc15] text-[#0b1120] px-3 py-1.5 rounded font-extrabold text-[11px] uppercase">+ İlan Ver</a>
                <button onclick="toggleMobileMenu()" class="text-white p-1.5 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            `;

            mobileMenu.innerHTML = `
                <a href="profil.html" class="block px-5 py-3.5 text-[#facc15] font-bold text-xs uppercase border-b border-slate-800">${gorunenIsim}</a>
                <a href="favorilerim.html" class="block px-5 py-3.5 text-[#facc15] font-extrabold text-xs border-b border-slate-800">Favorilerim</a>
                <a href="ilanlarim.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">İlanlarım</a>
                <a href="sohbetler.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">Mesajlar</a>
                <a href="teklifler.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">Teklifler</a>
                <button onclick="cikisYap()" class="w-full text-left block px-5 py-3.5 text-red-400 font-semibold text-xs">Çıkış Yap</button>
            `;
        }

        async function favorileriGetir() {
            const vitrin = document.getElementById('favoriler-vitrini');

            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'giris.html'; return; }

            benimEmailim = session.user.email;
            menuOlustur(session);

            try {
                const { data: favoriKayitlari, error: favError } = await _supabase.from('favoriler').select('ilan_id').eq('kullanici_email', benimEmailim);
                if (favError) throw favError;

                if (!favoriKayitlari || favoriKayitlari.length === 0) {
                    vitrin.innerHTML = `
                        <div class="bg-white border border-slate-200 rounded-md text-center py-16 px-4">
                            <p class="text-slate-800 font-extrabold uppercase text-sm tracking-wide mb-1">Henüz Favori İlanınız Yok</p>
                            <p class="text-slate-500 text-xs mb-5">Beğendiğiniz ilanları kalp ikonuna tıklayarak buraya kaydedebilirsiniz.</p>
                            <a href="index.html" class="inline-block bg-[#0f172a] hover:bg-black text-[#facc15] px-6 py-3 rounded font-extrabold text-xs uppercase tracking-wider transition-colors">Vitrine Göz At</a>
                        </div>`;
                    return;
                }

                const ilanIdleri = favoriKayitlari.map(kayit => kayit.ilan_id);

                const { data: ilanlar, error: ilanError } = await _supabase.from('ilanlar').select('*').in('id', ilanIdleri).order('id', { ascending: false });
                if (ilanError) throw ilanError;

                if (!ilanlar || ilanlar.length === 0) {
                    vitrin.innerHTML = `
                        <div class="bg-white border border-slate-200 rounded-md text-center py-16 px-4">
                            <p class="text-slate-800 font-extrabold uppercase text-sm tracking-wide mb-1">Favori İlanlar Kaldırılmış</p>
                            <a href="index.html" class="inline-block mt-4 bg-[#0f172a] hover:bg-black text-[#facc15] px-6 py-3 rounded font-extrabold text-xs uppercase tracking-wider transition-colors">Vitrine Göz At</a>
                        </div>`;
                    return;
                }

                let htmlCikti = '';
                ilanlar.forEach(ilan => {
                    const kapakResmi = ilan.resim_url ? ilan.resim_url.split(',')[0].trim() : "";
                    const isVitrin = vitrinAktifMi(ilan);
                    const kategori = guvenliMetin(ilan.kategori || 'Diğer');
                    const kartSinifi = isVitrin
                        ? 'border-2 border-[#eab308] bg-amber-50/20'
                        : 'border border-slate-200 hover:border-slate-400 bg-white';

                    htmlCikti += `
                    <div id="fav-kart-${ilan.id}" class="${kartSinifi} p-4 rounded-md flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 transition-all duration-200">
                        <div class="flex items-center gap-4 min-w-0 flex-1 cursor-pointer" onclick="window.location.href='detay.html?id=${ilan.id}'">
                            <div class="w-24 h-20 sm:w-28 sm:h-24 bg-slate-100 rounded-sm overflow-hidden flex-shrink-0 border border-slate-200 relative flex items-center justify-center">
                                ${isVitrin ? `<span class="absolute top-1 left-1 bg-[#0b1120] text-[#facc15] border border-[#facc15] px-1.5 py-0.5 rounded-sm text-[9px] font-extrabold uppercase tracking-wider">★ VİTRİN</span>` : ''}
                                ${kapakResmi
                                    ? `<img src="${guvenliMetin(kapakResmi)}" onerror="this.style.display='none'" class="w-full h-full object-cover">`
                                    : `<span class="text-[10px] font-bold text-slate-400 uppercase">Görsel Yok</span>`}
                            </div>
                            <div class="flex flex-col justify-center min-w-0">
                                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">${kategori}</span>
                                <h3 class="font-extrabold text-slate-900 text-sm sm:text-base truncate mb-1 hover:text-[#0f172a]">${guvenliMetin(ilan.baslik)}</h3>
                                <p class="text-slate-950 font-extrabold text-sm">${fiyatFormatla(ilan.deger)}</p>
                            </div>
                        </div>

                        <div class="flex gap-2 w-full sm:w-auto justify-end pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 flex-shrink-0">
                            <a href="detay.html?id=${ilan.id}" class="flex-1 sm:flex-none bg-[#0f172a] hover:bg-black text-[#facc15] font-extrabold text-xs uppercase tracking-wider px-5 py-2.5 min-h-[42px] rounded transition-colors flex items-center justify-center">İncele</a>
                            <button onclick="favoridenCikar(${ilan.id})" class="flex-1 sm:flex-none bg-white border border-red-200 text-red-600 hover:bg-red-50 font-bold text-xs uppercase tracking-wider px-5 py-2.5 min-h-[42px] rounded transition-colors cursor-pointer">Kaldır</button>
                        </div>
                    </div>`;
                });
                vitrin.innerHTML = htmlCikti;

            } catch (error) {
                vitrin.innerHTML = `<div class="bg-white border border-red-200 rounded-md p-6 text-center text-red-600 font-bold text-xs uppercase tracking-wider">Sistem Hatası: ${guvenliMetin(error.message)}</div>`;
            }
        }

        window.favoridenCikar = function(ilanId) {
            modalAc("Favorilerden Çıkar", "Bu ilanı favoriler listenizden kaldırmak istediğinize emin misiniz?", true, async () => {
                const kart = document.getElementById(`fav-kart-${ilanId}`);
                if (kart) {
                    kart.style.opacity = '0';
                    setTimeout(() => kart.remove(), 250);
                }

                const { error } = await _supabase.from('favoriler').delete().eq('ilan_id', ilanId).eq('kullanici_email', benimEmailim);

                if (error) {
                    modalAc("Hata", "İşlem sırasında bir hata oluştu: " + error.message, false);
                    favorileriGetir();
                } else {
                    const vitrin = document.getElementById('favoriler-vitrini');
                    setTimeout(() => {
                        if (vitrin.children.length === 0 || vitrin.innerText.trim() === '') {
                            favorileriGetir();
                        }
                    }, 300);
                }
            });
        };

        async function cikisYap() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        favorileriGetir();
    </script>
</body>
</html>
