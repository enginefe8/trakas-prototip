<!DOCTYPE html>

    <main class="max-w-6xl mx-auto p-4 md:p-8 w-full flex-grow mt-4 md:mt-8 mb-12">
        
        <!-- YENİ: Prestij (Hero) Alanı -->
        <div class="w-full bg-[#0f172a] rounded-3xl shadow-xl overflow-hidden mb-8 relative">
            <div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
            
            <div class="p-8 md:p-12 flex flex-col md:flex-row items-center justify-between relative z-10 gap-8">
                <div class="flex items-center gap-6">
                    <div class="w-24 h-24 md:w-32 md:h-32 bg-[#facc15] rounded-full flex items-center justify-center text-[#0f172a] font-black text-5xl md:text-6xl shadow-[0_0_30px_rgba(250,204,21,0.3)] border-4 border-[#0f172a]" id="hero-harf">?</div>
                    <div class="text-center md:text-left">
                        <h1 id="hero-isim" class="text-3xl md:text-5xl font-black text-white tracking-tight uppercase mb-2">--</h1>
                        <div id="hero-skor-kutu" class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2 rounded-xl">
                            <svg class="w-5 h-5 text-[#facc15]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            <span id="hero-skor" class="text-[#facc15] font-black tracking-widest text-sm md:text-base">HESAPLANIYOR...</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-4 md:gap-8 w-full md:w-auto">
                    <div class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl text-center backdrop-blur-sm">
                        <div id="ist-ilan" class="text-2xl md:text-3xl font-black text-white mb-1">-</div>
                        <div class="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest">Aktif İlan</div>
                    </div>
                    <div class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl text-center backdrop-blur-sm">
                        <div id="ist-takas" class="text-2xl md:text-3xl font-black text-[#34d399] mb-1">-</div>
                        <div class="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest">Takaslandı</div>
                    </div>
                    <div class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl text-center backdrop-blur-sm">
                        <div id="ist-yorum" class="text-2xl md:text-3xl font-black text-[#facc15] mb-1">-</div>
                        <div class="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest">Yorum</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- YENİ: Modern Sekme Sistemi -->
        <div class="bg-[#0f172a] rounded-2xl shadow-sm mb-8 flex overflow-x-auto border border-gray-200">
            <button onclick="sekmeDegistir('sekme-ayarlar')" id="btn-sekme-ayarlar" class="tab-btn active flex-1 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400 border-b-4 border-transparent hover:text-white whitespace-nowrap px-4">Hesap Ayarları</button>
            <button onclick="sekmeDegistir('sekme-ilanlar')" id="btn-sekme-ilanlar" class="tab-btn flex-1 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400 border-b-4 border-transparent hover:text-white whitespace-nowrap px-4">Aktif İlanlarım</button>
            <button onclick="sekmeDegistir('sekme-gecmis')" id="btn-sekme-gecmis" class="tab-btn flex-1 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400 border-b-4 border-transparent hover:text-white whitespace-nowrap px-4">Takas Geçmişi</button>
            <button onclick="sekmeDegistir('sekme-yorumlar')" id="btn-sekme-yorumlar" class="tab-btn flex-1 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400 border-b-4 border-transparent hover:text-white whitespace-nowrap px-4">Hakkımdaki Yorumlar</button>
        </div>

        <!-- İÇERİK ALANLARI -->
        <div id="sekme-ayarlar" class="sekme-icerik grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 relative overflow-hidden">
                <div id="yukleniyor-bilgi" class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center">
                    <svg class="animate-spin h-8 w-8 text-[#0f172a] mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>

                <h2 class="text-xl font-black text-gray-900 uppercase tracking-widest mb-6 border-b border-gray-100 pb-3">Kişisel Bilgiler</h2>
                
                <form onsubmit="bilgileriGuncelle(event)" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">E-POSTA ADRESİ (Değiştirilemez)</label>
                        <input type="email" id="email-alan" disabled class="w-full bg-gray-100 border border-gray-200 p-4 rounded-xl text-sm font-bold text-gray-500 cursor-not-allowed">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-widest mb-2">AD SOYAD</label>
                        <input type="text" id="ad-soyad" placeholder="Örn: Arda Yılmaz" class="w-full bg-gray-50 border border-gray-200 p-4 rounded-xl outline-none focus:border-[#facc15] focus:ring-1 focus:ring-[#facc15] text-sm font-bold text-gray-900 transition-all">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-widest mb-2">TELEFON NUMARASI</label>
                        <input type="tel" id="telefon" placeholder="Örn: 0555 123 45 67" class="w-full bg-gray-50 border border-gray-200 p-4 rounded-xl outline-none focus:border-[#facc15] focus:ring-1 focus:ring-[#facc15] text-sm font-bold text-gray-900 transition-all">
                    </div>

                    <button type="submit" id="btn-bilgi" class="w-full bg-[#0f172a] text-[#facc15] py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-md hover:bg-black hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2">
                        BİLGİLERİ KAYDET
                    </button>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 h-fit">
                <h2 class="text-xl font-black text-gray-900 uppercase tracking-widest mb-6 border-b border-gray-100 pb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Şifre Güvenliği
                </h2>
                
                <form onsubmit="sifreGuncelle(event)" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-widest mb-2">YENİ ŞİFRE</label>
                        <input type="password" id="yeni-sifre" required minlength="6" placeholder="En az 6 karakter" class="w-full bg-gray-50 border border-gray-200 p-4 rounded-xl outline-none focus:border-[#0f172a] focus:ring-1 focus:ring-[#0f172a] text-sm font-bold text-gray-900 transition-all">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-700 uppercase tracking-widest mb-2">YENİ ŞİFRE (TEKRAR)</label>
                        <input type="password" id="yeni-sifre-tekrar" required minlength="6" placeholder="Şifrenizi tekrar girin" class="w-full bg-gray-50 border border-gray-200 p-4 rounded-xl outline-none focus:border-[#0f172a] focus:ring-1 focus:ring-[#0f172a] text-sm font-bold text-gray-900 transition-all">
                    </div>

                    <button type="submit" id="btn-sifre" class="w-full bg-gray-100 text-gray-900 py-4 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-gray-200 transition-all flex justify-center items-center gap-2 border border-gray-200">
                        ŞİFREMİ GÜNCELLE
                    </button>
                </form>
            </div>
        </div>

        <div id="sekme-ilanlar" class="sekme-icerik hidden">
            <div id="liste-ilanlar" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Javascript ile dolacak -->
            </div>
        </div>

        <div id="sekme-gecmis" class="sekme-icerik hidden">
            <div id="liste-gecmis" class="space-y-4">
                <!-- Javascript ile dolacak -->
            </div>
        </div>

        <div id="sekme-yorumlar" class="sekme-icerik hidden">
            <div id="liste-yorumlar" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Javascript ile dolacak -->
            </div>
        </div>

    </main>

    <footer class="bg-[#0f172a] border-t-4 border-[#facc15] pt-12 pb-8 w-full mt-auto">
        <div class="max-w-7xl mx-auto flex flex-col items-center justify-center">
            <h2 class="text-4xl font-black text-white italic tracking-tighter uppercase mb-2">TRAKAS</h2>
            <p class="text-gray-500 text-xs font-bold tracking-widest uppercase">Takas Pazaryeri Platformu</p>
        </div>
    </footer>

    <div id="ozel-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm transition-opacity" onclick="modalKapat()"></div>
        <div id="ozel-modal-kutu" class="relative bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-300">
            <div class="text-center">
                <div id="modal-ikon" class="mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6"></div>
                <h3 id="modal-baslik" class="text-xl font-black text-gray-900 mb-2 uppercase tracking-wide">Bilgi</h3>
                <p id="modal-mesaj" class="text-gray-600 font-medium text-sm mb-8 leading-relaxed"></p>
                <button id="modal-btn-ana" onclick="modalKapat()" class="w-full bg-[#0f172a] text-white font-black px-4 py-4 rounded-xl hover:bg-black transition-colors uppercase text-[10px] tracking-widest shadow-md">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let kullaniciMail = "";

        async function sitemiCalistir() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) { window.location.href = 'giris.html'; return; }

                const user = session.user;
                kullaniciMail = user.email;
                
                const meta = user.user_metadata || {};
                const gorunenIsim = meta.ad_soyad ? meta.ad_soyad.toUpperCase() : kullaniciMail.split('@')[0].toUpperCase();
                
                document.getElementById('user-name').innerText = gorunenIsim;
                document.getElementById('hero-isim').innerText = gorunenIsim;
                document.getElementById('hero-harf').innerText = gorunenIsim.charAt(0);

                document.getElementById('email-alan').value = kullaniciMail;
                if(meta.ad_soyad) document.getElementById('ad-soyad').value = meta.ad_soyad;
                if(meta.telefon) document.getElementById('telefon').value = meta.telefon;

                document.getElementById('yukleniyor-bilgi').classList.add('hidden');

                // Verileri Çek
                await profilVerileriniCek();

            } catch (error) {
                console.error("Başlatma hatası:", error);
                modalAc("Hata", "Bilgiler çekilirken bir sorun oluştu.", "hata");
            }
        }

        async function profilVerileriniCek() {
            try {
                // 1. İLANLARIM (Aktif)
                const { data: ilanlar } = await _supabase.from('ilanlar').select('*').eq('sahip_email', kullaniciMail).order('created_at', { ascending: false });
                const aktifIlanlar = ilanlar ? ilanlar.filter(i => i.durum !== 'Takaslandı') : [];
                document.getElementById('ist-ilan').innerText = aktifIlanlar.length;

                let ilanHtml = "";
                if(aktifIlanlar.length === 0) {
                    ilanHtml = `<div class="col-span-full p-10 text-center border-2 border-dashed border-gray-200 rounded-2xl"><p class="text-gray-400 font-bold text-sm uppercase tracking-widest">Aktif ilanınız bulunmuyor.</p></div>`;
                } else {
                    aktifIlanlar.forEach(ilan => {
                        const ilkResim = ilan.resim_url ? ilan.resim_url.split(',')[0] : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none"><rect width="100%" height="100%" fill="%23f3f4f6"/></svg>';
                        ilanHtml += `
                        <a href="ilan-detay.html?id=${ilan.id}" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-200 hover:shadow-md transition-shadow group flex flex-col h-full">
                            <div class="h-48 overflow-hidden relative border-b border-gray-100 bg-gray-50 p-2">
                                <img src="${ilkResim}" class="w-full h-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-4">
                                <h3 class="font-black text-gray-900 text-sm truncate uppercase tracking-tight mb-2">${ilan.baslik}</h3>
                                <p class="text-[#0f172a] font-black text-lg">${ilan.deger} ₺</p>
                            </div>
                        </a>`;
                    });
                }
                document.getElementById('liste-ilanlar').innerHTML = ilanHtml;

                // 2. TAKAS GEÇMİŞİ VE YORUMLAR
                const { data: teklifler } = await _supabase.from('teklifler')
                    .select('*, ilanlar(baslik, resim_url)')
                    .or(`teklif_veren_email.eq.${kullaniciMail},ilan_id.in.(${ilanlar ? ilanlar.map(i=>i.id).join(',') : '0'})`)
                    .eq('durum', 'Tamamlandı');

                const gecmis = teklifler || [];
                document.getElementById('ist-takas').innerText = gecmis.length;

                let gecmisHtml = "";
                let yorumlarHtml = "";
                let alinanPuanlar = [];

                if(gecmis.length === 0) {
                    gecmisHtml = `<div class="p-10 text-center border-2 border-dashed border-gray-200 rounded-2xl"><p class="text-gray-400 font-bold text-sm uppercase tracking-widest">Henüz tamamlanmış bir takasınız yok.</p></div>`;
                    yorumlarHtml = `<div class="col-span-full p-10 text-center border-2 border-dashed border-gray-200 rounded-2xl"><p class="text-gray-400 font-bold text-sm uppercase tracking-widest">Henüz bir değerlendirme almadınız.</p></div>`;
                } else {
                    gecmis.forEach(t => {
                        const isBenimIlanim = t.ilanlar && (ilanlar.some(i => i.id === t.ilan_id));
                        const karsiEmail = isBenimIlanim ? t.teklif_veren_email : (t.ilanlar ? t.ilanlar.sahip_email : "Bilinmiyor");
                        const ilanBaslik = t.ilanlar ? t.ilanlar.baslik : "Silinmiş İlan";
                        const ilkResim = t.ilanlar && t.ilanlar.resim_url ? t.ilanlar.resim_url.split(',')[0] : "";

                        // Geçmiş Listesi
                        gecmisHtml += `
                        <div class="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between gap-4">
                            <div class="flex items-center gap-4 min-w-0">
                                <div class="w-12 h-12 rounded-lg bg-gray-100 overflow-hidden flex-shrink-0">
                                    ${ilkResim ? `<img src="${ilkResim}" class="w-full h-full object-cover">` : ``}
                                </div>
                                <div class="min-w-0">
                                    <h4 class="font-black text-sm text-[#0f172a] truncate uppercase">${ilanBaslik}</h4>
                                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest truncate mt-0.5">Takas: ${karsiEmail.split('@')[0]}</p>
                                </div>
                            </div>
                            <div class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-widest border border-emerald-200 shadow-sm flex-shrink-0">
                                TAKASLANDI
                            </div>
                        </div>`;

                        // Yorumları Ayıkla
                        if (isBenimIlanim && t.ilan_sahibi_puan) {
                            alinanPuanlar.push(t.ilan_sahibi_puan);
                            yorumlarHtml += yorumKutusuCiz(t.ilan_sahibi_puan, t.ilan_sahibi_yorum, karsiEmail.split('@')[0], ilanBaslik);
                        } else if (!isBenimIlanim && t.teklif_veren_puan) {
                            alinanPuanlar.push(t.teklif_veren_puan);
                            yorumlarHtml += yorumKutusuCiz(t.teklif_veren_puan, t.teklif_veren_yorum, karsiEmail.split('@')[0], ilanBaslik);
                        }
                    });
                }

                document.getElementById('liste-gecmis').innerHTML = gecmisHtml;
                document.getElementById('liste-yorumlar').innerHTML = yorumlarHtml || `<div class="col-span-full p-10 text-center border-2 border-dashed border-gray-200 rounded-2xl"><p class="text-gray-400 font-bold text-sm uppercase tracking-widest">Henüz bir değerlendirme almadınız.</p></div>`;
                document.getElementById('ist-yorum').innerText = alinanPuanlar.length;

                // GÜVEN SKORU HESAPLA
                if(alinanPuanlar.length > 0) {
                    const toplam = alinanPuanlar.reduce((a, b) => a + b, 0);
                    const ort = (toplam / alinanPuanlar.length).toFixed(1);
                    document.getElementById('hero-skor').innerText = `${ort} / 5.0`;
                } else {
                    document.getElementById('hero-skor').innerText = "YENİ ÜYE";
                }

            } catch (err) {
                console.error("Profil verisi çekilemedi", err);
            }
        }

        function yorumKutusuCiz(puan, yorum, kimden, ilanBaslik) {
            let yildizlar = "";
            for(let i=0; i<5; i++) {
                yildizlar += `<svg class="w-4 h-4 ${i < puan ? 'text-[#facc15]' : 'text-gray-200'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
            }
            return `
            <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
                <div class="flex justify-between items-start mb-3">
                    <div class="flex gap-1">${yildizlar}</div>
                    <span class="text-[9px] font-bold bg-gray-100 px-2 py-1 rounded text-gray-500 uppercase">${kimden}</span>
                </div>
                <p class="text-sm text-gray-700 font-medium mb-3">"${yorum || 'Yorum bırakılmadı.'}"</p>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest border-t border-gray-100 pt-3 truncate">İLAN: ${ilanBaslik}</p>
            </div>`;
        }

        function sekmeDegistir(hedefId) {
            document.querySelectorAll('.sekme-icerik').forEach(el => el.classList.add('hidden'));
            document.getElementById(hedefId).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-${hedefId}`).classList.add('active');
        }

        async function bilgileriGuncelle(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-bilgi');
            const orijinalIcerik = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> KAYDEDİLİYOR...`;

            const adSoyad = document.getElementById('ad-soyad').value.trim();
            const telefon = document.getElementById('telefon').value.trim();

            try {
                const { data, error } = await _supabase.auth.updateUser({
                    data: { ad_soyad: adSoyad, telefon: telefon }
                });

                if (error) throw error;

                const gorunenIsim = adSoyad ? adSoyad.toUpperCase() : kullaniciMail.split('@')[0].toUpperCase();
                document.getElementById('user-name').innerText = gorunenIsim;
                document.getElementById('hero-isim').innerText = gorunenIsim;
                document.getElementById('hero-harf').innerText = gorunenIsim.charAt(0);

                modalAc("Başarılı", "Kişisel bilgileriniz hesabınıza başarıyla kaydedildi.", "basarili");

            } catch (err) {
                modalAc("Hata", "Bilgiler güncellenemedi: " + err.message, "hata");
            } finally {
                btn.disabled = false;
                btn.innerHTML = orijinalIcerik;
            }
        }

        async function sifreGuncelle(event) {
            event.preventDefault();
            const sifre1 = document.getElementById('yeni-sifre').value;
            const sifre2 = document.getElementById('yeni-sifre-tekrar').value;

            if(sifre1 !== sifre2) {
                modalAc("Hata", "Girdiğiniz şifreler birbiriyle uyuşmuyor. Lütfen kontrol edin.", "uyari");
                return;
            }

            const btn = document.getElementById('btn-sifre');
            const orijinalIcerik = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> GÜNCELLENİYOR...`;

            try {
                const { error } = await _supabase.auth.updateUser({ password: sifre1 });
                if (error) throw error;

                document.getElementById('yeni-sifre').value = "";
                document.getElementById('yeni-sifre-tekrar').value = "";
                modalAc("Şifre Değişti", "Şifreniz başarıyla güncellendi. Bir sonraki girişinizde yeni şifrenizi kullanabilirsiniz.", "basarili");

            } catch (err) {
                modalAc("Hata", "Şifre güncellenirken bir sorun oluştu: " + err.message, "hata");
            } finally {
                btn.disabled = false;
                btn.innerHTML = orijinalIcerik;
            }
        }

        let modalOnayFonk = null;
        function modalAc(baslik, mesaj, tip, onayFonk = null) {
            document.getElementById('modal-baslik').innerText = baslik;
            document.getElementById('modal-mesaj').innerText = mesaj;
            modalOnayFonk = onayFonk;
            
            const ikon = document.getElementById('modal-ikon');
            if(tip === 'basarili') { ikon.className = "mx-auto h-16 w-16 rounded-full bg-green-50 flex items-center justify-center text-green-500 font-bold text-2xl border border-green-100"; ikon.innerHTML = "✓"; }
            else if(tip === 'hata') { ikon.className = "mx-auto h-16 w-16 rounded-full bg-red-50 flex items-center justify-center text-red-500 font-bold text-2xl border border-red-100"; ikon.innerHTML = "!"; }
            else { ikon.className = "mx-auto h-16 w-16 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-500 font-bold text-2xl border border-yellow-100"; ikon.innerHTML = "?"; }
            
            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
            if(tip === 'basarili' && !onayFonk) setTimeout(modalKapat, 2500);
        }

        function modalKapat() {
            document.getElementById('ozel-modal-kutu').classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 300);
            if(modalOnayFonk) { modalOnayFonk(); modalOnayFonk = null; }
        }

        async function cikisYap() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }

        sitemiCalistir();
    </script>
</body>
</html>
