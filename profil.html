<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profilim — Trakas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-btn.active { border-bottom-color: #facc15; color: #ffffff; background-color: rgba(255, 255, 255, 0.05); }
        .tab-btn { transition: all 0.15s ease; }
    </style>
</head>
<body class="bg-[#f1f5f9] min-h-[100dvh] flex flex-col text-slate-900 antialiased overflow-x-hidden">

    <!-- ÜST MENÜ -->
    <nav class="bg-[#0b1120] border-b border-slate-800 sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-sm px-2 py-0.5 rounded-sm tracking-tighter">TR</span>
                <span class="text-2xl font-black text-white tracking-tight uppercase">TRAKAS</span>
            </a>
            <div id="auth-menu" class="hidden lg:flex items-center gap-6"></div>
            <div id="auth-menu-mobil" class="lg:hidden flex items-center gap-3"></div>
        </div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-[#0b1120] border-t border-slate-800 shadow-2xl flex-col z-50"></div>
    </nav>

    <!-- KOYU PROFİL ÜST BANDI -->
    <section class="bg-[#0f172a] border-b border-slate-800 w-full">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex flex-col sm:flex-row items-center gap-4 sm:gap-5 text-center sm:text-left">
                    <div class="w-18 h-18 sm:w-20 sm:h-20 bg-[#facc15] rounded-md flex items-center justify-center text-[#0b1120] font-black text-3xl sm:text-4xl flex-shrink-0 border-2 border-slate-700" id="hero-harf">?</div>
                    <div>
                        <h1 id="hero-isim" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight uppercase">--</h1>
                        <div id="hero-skor-kutu" class="inline-flex items-center gap-1.5 bg-slate-800/90 border border-slate-700 px-3 py-1 rounded-sm mt-2">
                            <svg class="w-4 h-4 text-[#facc15]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            <span id="hero-skor" class="text-[#facc15] font-extrabold tracking-wider text-xs">HESAPLANIYOR...</span>
                        </div>
                    </div>
                </div>

                <!-- İSTATİSTİK KUTULARI -->
                <div class="grid grid-cols-3 gap-2.5 sm:gap-3 w-full md:w-auto">
                    <div class="bg-slate-800/60 border border-slate-700 px-4 py-3 rounded text-center min-w-[90px]">
                        <div id="ist-ilan" class="text-xl sm:text-2xl font-black text-white">-</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">Aktif İlan</div>
                    </div>
                    <div class="bg-slate-800/60 border border-slate-700 px-4 py-3 rounded text-center min-w-[90px]">
                        <div id="ist-takas" class="text-xl sm:text-2xl font-black text-emerald-400">-</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">Takaslandı</div>
                    </div>
                    <div class="bg-slate-800/60 border border-slate-700 px-4 py-3 rounded text-center min-w-[90px]">
                        <div id="ist-yorum" class="text-xl sm:text-2xl font-black text-[#facc15]">-</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">Yorum</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SEKME ŞERİDİ -->
        <div class="bg-[#0b1120] border-t border-slate-800">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 flex overflow-x-auto no-scrollbar">
                <button onclick="sekmeDegistir('sekme-ayarlar')" id="btn-sekme-ayarlar" class="tab-btn active py-3.5 px-4 sm:px-6 text-xs font-extrabold uppercase tracking-wider text-slate-400 border-b-2 border-transparent hover:text-white whitespace-nowrap cursor-pointer">Hesap Ayarları</button>
                <button onclick="sekmeDegistir('sekme-ilanlar')" id="btn-sekme-ilanlar" class="tab-btn py-3.5 px-4 sm:px-6 text-xs font-extrabold uppercase tracking-wider text-slate-400 border-b-2 border-transparent hover:text-white whitespace-nowrap cursor-pointer">Aktif İlanlarım</button>
                <button onclick="sekmeDegistir('sekme-gecmis')" id="btn-sekme-gecmis" class="tab-btn py-3.5 px-4 sm:px-6 text-xs font-extrabold uppercase tracking-wider text-slate-400 border-b-2 border-transparent hover:text-white whitespace-nowrap cursor-pointer">Takas Geçmişi</button>
                <button onclick="sekmeDegistir('sekme-yorumlar')" id="btn-sekme-yorumlar" class="tab-btn py-3.5 px-4 sm:px-6 text-xs font-extrabold uppercase tracking-wider text-slate-400 border-b-2 border-transparent hover:text-white whitespace-nowrap cursor-pointer">Yorumlar</button>
            </div>
        </div>
    </section>

    <!-- ANA İÇERİK -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">

        <!-- SEKME 1: HESAP AYARLARI -->
        <div id="sekme-ayarlar" class="sekme-icerik grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div class="bg-white rounded-md border border-slate-200 p-5 sm:p-6 relative overflow-hidden">
                <div id="yukleniyor-bilgi" class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center">
                    <svg class="animate-spin h-7 w-7 text-[#0f172a]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>

                <h2 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider pb-3 mb-5 border-b border-slate-100 flex items-center gap-2">
                    <span class="w-1.5 h-4 bg-[#0f172a] inline-block rounded-xs"></span>
                    Kişisel Bilgiler
                </h2>

                <form onsubmit="bilgileriGuncelle(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-1.5">E-Posta Adresi (Değiştirilemez)</label>
                        <input type="email" id="email-alan" disabled class="w-full bg-slate-100 border border-slate-200 px-3.5 py-3 min-h-[46px] rounded text-base md:text-sm font-semibold text-slate-500 cursor-not-allowed">
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-600 uppercase tracking-wider mb-1.5">Ad Soyad</label>
                        <input type="text" id="ad-soyad" placeholder="Örn: Arda Yılmaz" class="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 min-h-[46px] rounded outline-none focus:bg-white focus:border-[#0f172a] text-base md:text-sm font-semibold text-slate-900 transition-colors">
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-600 uppercase tracking-wider mb-1.5">Telefon Numarası</label>
                        <input type="tel" id="telefon" inputmode="tel" placeholder="Örn: 0555 123 45 67" class="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 min-h-[46px] rounded outline-none focus:bg-white focus:border-[#0f172a] text-base md:text-sm font-semibold text-slate-900 transition-colors">
                    </div>

                    <button type="submit" id="btn-bilgi" class="w-full bg-[#0f172a] hover:bg-black text-[#facc15] py-3.5 min-h-[46px] rounded font-extrabold text-xs uppercase tracking-wider transition-colors flex justify-center items-center gap-2 cursor-pointer mt-2">
                        Bilgileri Kaydet
                    </button>
                </form>
            </div>

            <div class="bg-white rounded-md border border-slate-200 p-5 sm:p-6 h-fit">
                <h2 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider pb-3 mb-5 border-b border-slate-100 flex items-center gap-2">
                    <span class="w-1.5 h-4 bg-[#facc15] inline-block rounded-xs"></span>
                    Şifre Güvenliği
                </h2>

                <form onsubmit="sifreGuncelle(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-600 uppercase tracking-wider mb-1.5">Yeni Şifre</label>
                        <input type="password" id="yeni-sifre" required minlength="6" placeholder="En az 6 karakter" class="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 min-h-[46px] rounded outline-none focus:bg-white focus:border-[#0f172a] text-base md:text-sm font-semibold text-slate-900 transition-colors">
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-600 uppercase tracking-wider mb-1.5">Yeni Şifre (Tekrar)</label>
                        <input type="password" id="yeni-sifre-tekrar" required minlength="6" placeholder="Şifrenizi tekrar girin" class="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 min-h-[46px] rounded outline-none focus:bg-white focus:border-[#0f172a] text-base md:text-sm font-semibold text-slate-900 transition-colors">
                    </div>

                    <button type="submit" id="btn-sifre" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-900 py-3.5 min-h-[46px] rounded font-extrabold text-xs uppercase tracking-wider transition-colors flex justify-center items-center gap-2 border border-slate-300 cursor-pointer mt-2">
                        Şifremi Güncelle
                    </button>
                </form>
            </div>
        </div>

        <!-- SEKME 2: AKTİF İLANLARIM -->
        <div id="sekme-ilanlar" class="sekme-icerik hidden">
            <div id="liste-ilanlar" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- SEKME 3: TAKAS GEÇMİŞİ -->
        <div id="sekme-gecmis" class="sekme-icerik hidden">
            <div id="liste-gecmis" class="space-y-3"></div>
        </div>

        <!-- SEKME 4: YORUMLAR -->
        <div id="sekme-yorumlar" class="sekme-icerik hidden">
            <div id="liste-yorumlar" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#0b1120] border-t-2 border-[#facc15] pt-7 pb-[max(1.75rem,env(safe-area-inset-bottom))] w-full mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="bg-[#facc15] text-[#0b1120] font-black text-xs px-1.5 py-0.5 rounded-sm">TR</span>
                <span class="text-lg font-black text-white tracking-tight uppercase">TRAKAS</span>
                <span class="text-slate-500 text-xs font-medium ml-2">Takas Pazaryeri</span>
            </div>
            <p class="text-slate-500 text-xs font-medium">© 2026 TRAKAS. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- MODAL -->
    <div id="ozel-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-slate-950/75" onclick="modalKapat()"></div>
        <div id="ozel-modal-kutu" class="relative bg-white p-6 rounded-md border border-slate-300 shadow-2xl w-full max-w-sm transform scale-95 opacity-0 transition-all duration-200">
            <div class="text-center">
                <div id="modal-ikon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-md mb-4"></div>
                <h3 id="modal-baslik" class="text-base font-extrabold text-slate-900 mb-2 uppercase tracking-wide">Bilgi</h3>
                <p id="modal-mesaj" class="text-slate-600 font-medium text-sm mb-6 leading-relaxed"></p>
                <button id="modal-btn-ana" onclick="modalKapat()" class="w-full bg-[#0f172a] hover:bg-black text-[#facc15] font-extrabold px-4 py-3 min-h-[44px] rounded transition-colors uppercase text-xs tracking-wider cursor-pointer">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ivnazhfahtjcdspclkis.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bmF6aGZhaHRqY2RzcGNsa2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTgxNzEsImV4cCI6MjA4ODc5NDE3MX0.Z2bKgccAQX8dgex99cQL-GLpTYU1vhb-0BqWiuIMhxU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let kullaniciMail = "";

        function guvenliMetin(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function fiyatFormatla(deger) {
            const sayi = Number(deger);
            if (isNaN(sayi)) return '0 ₺';
            return sayi.toLocaleString('tr-TR') + ' ₺';
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function menuOlustur(gorunenIsim) {
            const menuDiv = document.getElementById('auth-menu');
            const mobilTopDiv = document.getElementById('auth-menu-mobil');
            const mobileMenu = document.getElementById('mobile-menu');
            const guvenliIsim = guvenliMetin(gorunenIsim);

            menuDiv.innerHTML = `
                <a href="profil.html" id="user-name" class="text-[#facc15] font-extrabold text-xs uppercase tracking-wider border-b-2 border-[#facc15] pb-0.5 flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    ${guvenliIsim}
                </a>
                <a href="favorilerim.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">Favorilerim</a>
                <a href="ilanlarim.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">İlanlarım</a>
                <a href="sohbetler.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">Mesajlar</a>
                <a href="teklifler.html" class="text-slate-300 font-semibold text-xs hover:text-white transition-colors">Teklifler</a>
                <span class="text-slate-700">|</span>
                <button onclick="cikisYap()" class="text-slate-400 font-semibold text-xs hover:text-red-400 transition-colors cursor-pointer">Çıkış</button>
                <a href="ilan-ver.html" class="bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] px-4 py-2 rounded font-extrabold text-xs uppercase tracking-wider transition-colors">+ İlan Ver</a>
            `;

            mobilTopDiv.innerHTML = `
                <a href="ilan-ver.html" class="bg-[#facc15] text-[#0b1120] px-3 py-1.5 rounded font-extrabold text-[11px] uppercase">+ İlan Ver</a>
                <button onclick="toggleMobileMenu()" class="text-white p-1.5 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            `;

            mobileMenu.innerHTML = `
                <a href="profil.html" class="block px-5 py-3.5 text-[#facc15] font-extrabold text-xs uppercase border-b border-slate-800">${guvenliIsim}</a>
                <a href="favorilerim.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">Favorilerim</a>
                <a href="ilanlarim.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">İlanlarım</a>
                <a href="sohbetler.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">Mesajlar</a>
                <a href="teklifler.html" class="block px-5 py-3.5 text-slate-300 font-semibold text-xs border-b border-slate-800">Teklifler</a>
                <button onclick="cikisYap()" class="w-full text-left block px-5 py-3.5 text-red-400 font-semibold text-xs">Çıkış Yap</button>
            `;
        }

        async function sitemiCalistir() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) { window.location.href = 'giris.html'; return; }

                const user = session.user;
                kullaniciMail = user.email;

                const meta = user.user_metadata || {};
                const gorunenIsim = meta.ad_soyad ? meta.ad_soyad.toUpperCase() : kullaniciMail.split('@')[0].toUpperCase();

                menuOlustur(gorunenIsim);
                document.getElementById('hero-isim').innerText = gorunenIsim;
                document.getElementById('hero-harf').innerText = gorunenIsim.charAt(0);

                document.getElementById('email-alan').value = kullaniciMail;
                if (meta.ad_soyad) document.getElementById('ad-soyad').value = meta.ad_soyad;
                if (meta.telefon) document.getElementById('telefon').value = meta.telefon;

                document.getElementById('yukleniyor-bilgi').classList.add('hidden');

                await profilVerileriniCek();

            } catch (error) {
                console.error("Başlatma hatası:", error);
                modalAc("Hata", "Bilgiler çekilirken bir sorun oluştu.", "hata");
            }
        }

        async function profilVerileriniCek() {
            try {
                const { data: ilanlar } = await _supabase.from('ilanlar').select('*').eq('sahip_email', kullaniciMail).order('created_at', { ascending: false });
                const aktifIlanlar = ilanlar ? ilanlar.filter(i => i.durum !== 'Takaslandı') : [];
                document.getElementById('ist-ilan').innerText = aktifIlanlar.length;

                let ilanHtml = "";
                if (aktifIlanlar.length === 0) {
                    ilanHtml = `<div class="col-span-full bg-white p-12 text-center border border-slate-200 rounded-md"><p class="text-slate-500 font-bold text-xs uppercase tracking-wider">Aktif ilanınız bulunmuyor.</p></div>`;
                } else {
                    aktifIlanlar.forEach(ilan => {
                        const ilkResim = ilan.resim_url ? ilan.resim_url.split(',')[0].trim() : '';
                        ilanHtml += `
                        <a href="detay.html?id=${ilan.id}" class="bg-white rounded-md overflow-hidden border border-slate-200 hover:border-slate-900 transition-colors group flex flex-col h-full">
                            <div class="h-44 overflow-hidden relative border-b border-slate-100 bg-slate-100 flex items-center justify-center">
                                ${ilkResim
                                    ? `<img src="${guvenliMetin(ilkResim)}" onerror="this.style.display='none'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`
                                    : `<span class="text-xs font-bold text-slate-400 uppercase">Görsel Yok</span>`}
                            </div>
                            <div class="p-4 flex flex-col flex-grow">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">${guvenliMetin(ilan.kategori || 'Diğer')}</span>
                                <h3 class="font-bold text-slate-900 text-sm truncate mb-2">${guvenliMetin(ilan.baslik)}</h3>
                                <p class="text-slate-950 font-extrabold text-base mt-auto pt-2 border-t border-slate-100">${fiyatFormatla(ilan.deger)}</p>
                            </div>
                        </a>`;
                    });
                }
                document.getElementById('liste-ilanlar').innerHTML = ilanHtml;

                const { data: teklifler } = await _supabase.from('teklifler')
                    .select('*, ilanlar(baslik, resim_url, sahip_email)')
                    .or(`teklif_veren_email.eq.${kullaniciMail},ilan_id.in.(${ilanlar && ilanlar.length > 0 ? ilanlar.map(i => i.id).join(',') : '0'})`)
                    .eq('durum', 'Tamamlandı');

                const gecmis = teklifler || [];
                document.getElementById('ist-takas').innerText = gecmis.length;

                let gecmisHtml = "";
                let yorumlarHtml = "";
                let alinanPuanlar = [];

                if (gecmis.length === 0) {
                    gecmisHtml = `<div class="bg-white p-12 text-center border border-slate-200 rounded-md"><p class="text-slate-500 font-bold text-xs uppercase tracking-wider">Henüz tamamlanmış bir takasınız yok.</p></div>`;
                    yorumlarHtml = `<div class="col-span-full bg-white p-12 text-center border border-slate-200 rounded-md"><p class="text-slate-500 font-bold text-xs uppercase tracking-wider">Henüz bir değerlendirme almadınız.</p></div>`;
                } else {
                    gecmis.forEach(t => {
                        const isBenimIlanim = t.ilanlar && (ilanlar.some(i => i.id === t.ilan_id));
                        const karsiEmail = isBenimIlanim ? t.teklif_veren_email : (t.ilanlar && t.ilanlar.sahip_email ? t.ilanlar.sahip_email : "Bilinmiyor");
                        const ilanBaslik = t.ilanlar ? t.ilanlar.baslik : "Silinmiş İlan";
                        const ilkResim = t.ilanlar && t.ilanlar.resim_url ? t.ilanlar.resim_url.split(',')[0].trim() : "";

                        gecmisHtml += `
                        <div class="bg-white border border-slate-200 rounded-md p-4 flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3.5 min-w-0">
                                <div class="w-12 h-12 rounded-sm bg-slate-100 border border-slate-200 overflow-hidden flex-shrink-0">
                                    ${ilkResim ? `<img src="${guvenliMetin(ilkResim)}" onerror="this.style.display='none'" class="w-full h-full object-cover">` : ``}
                                </div>
                                <div class="min-w-0">
                                    <h4 class="font-extrabold text-sm text-slate-900 truncate">${guvenliMetin(ilanBaslik)}</h4>
                                    <p class="text-xs font-semibold text-slate-500 truncate mt-0.5">Takas: ${guvenliMetin(karsiEmail.split('@')[0])}</p>
                                </div>
                            </div>
                            <span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-sm text-[10px] font-extrabold uppercase tracking-wider border border-emerald-300 flex-shrink-0">
                                ✓ Takaslandı
                            </span>
                        </div>`;

                        if (isBenimIlanim && t.ilan_sahibi_puan) {
                            alinanPuanlar.push(t.ilan_sahibi_puan);
                            yorumlarHtml += yorumKutusuCiz(t.ilan_sahibi_puan, t.ilan_sahibi_yorum, karsiEmail.split('@')[0], ilanBaslik);
                        } else if (!isBenimIlanim && t.teklif_veren_puan) {
                            alinanPuanlar.push(t.teklif_veren_puan);
                            yorumlarHtml += yorumKutusuCiz(t.teklif_veren_puan, t.teklif_veren_yorum, karsiEmail.split('@')[0], ilanBaslik);
                        }
                    });
                }

                document.getElementById('liste-gecmis').innerHTML = gecmisHtml;
                document.getElementById('liste-yorumlar').innerHTML = yorumlarHtml || `<div class="col-span-full bg-white p-12 text-center border border-slate-200 rounded-md"><p class="text-slate-500 font-bold text-xs uppercase tracking-wider">Henüz bir değerlendirme almadınız.</p></div>`;
                document.getElementById('ist-yorum').innerText = alinanPuanlar.length;

                if (alinanPuanlar.length > 0) {
                    const toplam = alinanPuanlar.reduce((a, b) => a + b, 0);
                    const ort = (toplam / alinanPuanlar.length).toFixed(1);
                    document.getElementById('hero-skor').innerText = `${ort} / 5.0`;
                } else {
                    document.getElementById('hero-skor').innerText = "YENİ ÜYE";
                }

            } catch (err) {
                console.error("Profil verisi çekilemedi", err);
            }
        }

        function yorumKutusuCiz(puan, yorum, kimden, ilanBaslik) {
            let yildizlar = "";
            for (let i = 0; i < 5; i++) {
                yildizlar += `<svg class="w-4 h-4 ${i < puan ? 'text-[#facc15]' : 'text-slate-200'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
            }
            return `
            <div class="bg-white border border-slate-200 rounded-md p-5">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex gap-0.5">${yildizlar}</div>
                    <span class="text-[10px] font-bold bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-sm text-slate-600 uppercase">${guvenliMetin(kimden)}</span>
                </div>
                <p class="text-sm text-slate-700 font-medium leading-relaxed mb-3 break-words">"${guvenliMetin(yorum || 'Yorum bırakılmadı.')}"</p>
                <p class="text-[11px] font-semibold text-slate-400 border-t border-slate-100 pt-2.5 truncate">İlan: ${guvenliMetin(ilanBaslik)}</p>
            </div>`;
        }

        function sekmeDegistir(hedefId) {
            document.querySelectorAll('.sekme-icerik').forEach(el => el.classList.add('hidden'));
            document.getElementById(hedefId).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-${hedefId}`).classList.add('active');
        }

        async function bilgileriGuncelle(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-bilgi');
            const orijinalIcerik = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-[#facc15]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Kaydediliyor...`;

            const adSoyad = document.getElementById('ad-soyad').value.trim();
            const telefon = document.getElementById('telefon').value.trim();

            try {
                const { data, error } = await _supabase.auth.updateUser({
                    data: { ad_soyad: adSoyad, telefon: telefon }
                });

                if (error) throw error;

                const gorunenIsim = adSoyad ? adSoyad.toUpperCase() : kullaniciMail.split('@')[0].toUpperCase();
                menuOlustur(gorunenIsim);
                document.getElementById('hero-isim').innerText = gorunenIsim;
                document.getElementById('hero-harf').innerText = gorunenIsim.charAt(0);

                modalAc("Başarılı", "Kişisel bilgileriniz hesabınıza başarıyla kaydedildi.", "basarili");

            } catch (err) {
                modalAc("Hata", "Bilgiler güncellenemedi: " + err.message, "hata");
            } finally {
                btn.disabled = false;
                btn.innerHTML = orijinalIcerik;
            }
        }

        async function sifreGuncelle(event) {
            event.preventDefault();
            const sifre1 = document.getElementById('yeni-sifre').value;
            const sifre2 = document.getElementById('yeni-sifre-tekrar').value;

            if (sifre1 !== sifre2) {
                modalAc("Hata", "Girdiğiniz şifreler birbiriyle uyuşmuyor. Lütfen kontrol edin.", "uyari");
                return;
            }

            const btn = document.getElementById('btn-sifre');
            const orijinalIcerik = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-slate-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Güncelleniyor...`;

            try {
                const { error } = await _supabase.auth.updateUser({ password: sifre1 });
                if (error) throw error;

                document.getElementById('yeni-sifre').value = "";
                document.getElementById('yeni-sifre-tekrar').value = "";
                modalAc("Şifre Değişti", "Şifreniz başarıyla güncellendi. Bir sonraki girişinizde yeni şifrenizi kullanabilirsiniz.", "basarili");

            } catch (err) {
                modalAc("Hata", "Şifre güncellenirken bir sorun oluştu: " + err.message, "hata");
            } finally {
                btn.disabled = false;
                btn.innerHTML = orijinalIcerik;
            }
        }

        let modalOnayFonk = null;
        function modalAc(baslik, mesaj, tip, onayFonk = null) {
            document.getElementById('modal-baslik').innerText = baslik;
            document.getElementById('modal-mesaj').innerText = mesaj;
            modalOnayFonk = onayFonk;

            const ikon = document.getElementById('modal-ikon');
            if (tip === 'basarili') { ikon.className = "mx-auto h-12 w-12 rounded-md bg-emerald-50 flex items-center justify-center text-emerald-600 font-extrabold text-xl border border-emerald-200 mb-4"; ikon.innerHTML = "✓"; }
            else if (tip === 'hata') { ikon.className = "mx-auto h-12 w-12 rounded-md bg-red-50 flex items-center justify-center text-red-600 font-extrabold text-xl border border-red-200 mb-4"; ikon.innerHTML = "!"; }
            else { ikon.className = "mx-auto h-12 w-12 rounded-md bg-amber-50 flex items-center justify-center text-amber-600 font-extrabold text-xl border border-amber-200 mb-4"; ikon.innerHTML = "?"; }

            document.getElementById('ozel-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('ozel-modal-kutu').classList.remove('scale-95', 'opacity-0'); }, 10);
            if (tip === 'basarili' && !onayFonk) setTimeout(modalKapat, 2500);
        }

        function modalKapat() {
            document.getElementById('ozel-modal-kutu').classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('ozel-modal').classList.add('hidden'); }, 200);
            if (modalOnayFonk) { modalOnayFonk(); modalOnayFonk = null; }
        }

        async function cikisYap() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }

        sitemiCalistir();
    </script>
</body>
</html>
